function requiredTraitCount() {
  if (setup.difficulty === "ULTIMATE") return 5;
  if (setup.difficulty === "HARD") return 3;

function buildHunterIdentity(traitIds) {
  if (!traitIds || traitIds.length === 0) {
    return { code: "---", enName: "---", zhName: "---", anchors: "" };
  }
  const sortedNums = traitIds
    .map(id => traitsConfig.traits[id]?.num)
    .filter(Boolean)
    .sort((a, b) => Number(a) - Number(b));
  const key = sortedNums.join("");

  if (traitsConfig.roster && traitsConfig.roster[key]) {
    return { code: key, ...traitsConfig.roster[key] };
  }
  const partialZh = sortedNums.map(n => {
    const id = TRAIT_ORDER[Number(n) - 1];
    return traitsConfig.traits[id]?.anchor || "";
  }).join("·");
  return {
    code: key,
    enName: `Picking (${traitIds.length}/3)`,
    zhName: partialZh,
    anchors: partialZh
  };
}

function computeHunterStats(traitIds) {
  const base = traitsConfig.baseHunter || FALLBACK_TRAITS_DATA.baseHunter;
  const active = {
    blind: false,
    prosthesis: false,
    deaf: false,
    tremor: false,
    asthma: false
  };
  for (const id of traitIds) {
    if (id in active) active[id] = true;
  }

  const tStats = traitsConfig.traits || FALLBACK_TRAITS_DATA.traits;
  const walkMult = active.prosthesis ? (tStats.prosthesis?.stats?.walkSpeedMultiplier ?? 0.62) : 1.0;

  return {
    active,
    walkSpeed: (base.walkSpeed ?? 210) * walkMult,
    climbSpeed: base.climbSpeed ?? 145,
    jumpVel: base.jumpVel ?? -505,
    maxHp: base.hp ?? 100,
    bulletSpeed: base.bulletSpeed ?? 660,
    bulletDropRatio: base.bulletDropRatio ?? 0.75,
    sightRadius: tStats.blind?.stats?.sightRadius ?? 155,
    inputDelaySec: tStats.deaf?.stats?.inputDelaySec ?? 0.40,
    sfxGainMultiplier: tStats.deaf?.stats?.sfxGainMultiplier ?? 0.30,
    bgmVolumeScale: active.deaf
      ? (tStats.deaf?.stats?.bgmVolumeScale ?? 0.27)
      : (tStats.blind?.stats?.bgmVolumeScale ?? 1.0),
    aimJitterPx: tStats.tremor?.stats?.aimJitterPx ?? 14,
    spreadRad: tStats.tremor?.stats?.spreadRad ?? 0.32,
    headShakePx: tStats.tremor?.stats?.headShakePx ?? 1.5,
    fatigueGainPerSec: tStats.asthma?.stats?.fatigueGainPerSec ?? 42,
    fatigueDecayPerSec: tStats.asthma?.stats?.fatigueDecayPerSec ?? 58,
    stunDurationSec: tStats.asthma?.stats?.stunDurationSec ?? 1.0
  };
}

function setDifficulty(diff) {
  setup.difficulty = diff;
  if (diff === "NORMAL") {
    setup.selected = setup.selected.length > 0 ? [setup.selected[0]] : ["blind"];
  } else if (diff === "HARD") {
    while (setup.selected.length > 3) setup.selected.pop();
  } else if (diff === "ULTIMATE") {
    setup.selected = [...TRAIT_ORDER];
  }
}

function toggleTraitSelection(traitId) {
  if (setup.difficulty === "ULTIMATE") return;
  const maxPicks = requiredTraitCount();
  const idx = setup.selected.indexOf(traitId);
  if (idx !== -1) {
    setup.selected.splice(idx, 1);
  } else {
    if (setup.selected.length >= maxPicks) setup.selected.shift();
    setup.selected.push(traitId);
  }
}

function loadKeyedSprite(src, keyWhiteBg = true) {
  const entry = { img: new Image(), canvas: null, loaded: false };
  entry.img.onload = () => {
    try {
      const w = entry.img.naturalWidth;
      const h = entry.img.naturalHeight;
      const off = document.createElement("canvas");
      off.width = w;
      off.height = h;
      const octx = off.getContext("2d");
      octx.drawImage(entry.img, 0, 0);

      if (keyWhiteBg) {
        const imgData = octx.getImageData(0, 0, w, h);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2];
          if (r > 240 && g > 240 && b > 240) {
            d[i + 3] = 0;
          } else if (r > 224 && g > 224 && b > 224) {
            const minC = Math.min(r, g, b);
            d[i + 3] = Math.max(0, Math.min(255, Math.round((240 - minC) * 15)));
          }
        }
        octx.putImageData(imgData, 0, 0);
      }

      entry.canvas = off;
      entry.loaded = true;
    } catch (_) {
      entry.canvas = null;
      entry.loaded = true;
    }
  };
  entry.img.onerror = () => {
    entry.loaded = false;
  };
  entry.img.src = src;
  return entry;
}

function loadOptionalImage(src) {
  const img = new Image();
  img.loaded = false;
  img.onload = () => { img.loaded = true; };
  img.onerror = () => { img.loaded = false; };
  img.src = src;
  return img;
}

/* ============================================================================
 * 4. RETRO WEB AUDIO SYNTH + STAGE BGM CONTROLLER
 * ========================================================================== */
const SFX = {
  ctx: null,
  muted: false,
  unlock() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {});
    }
    this.syncBgm();
  },
  syncBgm() {
    const bgm = stageManager.bgmAudio;
    if (!bgm) return;
    if (this.muted || game.state !== "PLAY") {
      bgm.pause();
    } else {
      bgm.volume = Math.max(0, Math.min(1, 0.45 * (hero.stats?.bgmVolumeScale ?? 1.0)));
      bgm.play().catch(() => {});
    }
  },
  beep(freq, dur, type = "square", gainVal = 0.08, slideTo = null) {
    if (this.muted || !this.ctx) return;
    const deafMult = hero.traits.deaf ? (hero.stats?.sfxGainMultiplier ?? 0.30) : 1.0;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq * (hero.traits.deaf ? 0.68 : 1), t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(gainVal * deafMult, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
};

window.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const cx = Math.max(0, Math.min(W, ((e.clientX - rect.left) / rect.width) * W));
  const cy = Math.max(0, Math.min(H, ((e.clientY - rect.top) / rect.height) * H));
  mouse.screenX = cx;
  mouse.screenY = cy;

  if (debugDrag.active) {
    debugDrag.curX = Math.round(cx + game.camX);
    debugDrag.curY = Math.round(cy + game.camY);
  }
});

  SFX.unlock();
  const rect = canvas.getBoundingClientRect();
  const cx = ((e.clientX - rect.left) / rect.width) * W;
  const cy = ((e.clientY - rect.top) / rect.height) * H;

  if (game.state === "SELECT") {
    for (const box of setup.uiBoxes) {
      if (cx >= box.x && cx <= box.x + box.w && cy >= box.y && cy <= box.y + box.h) {
        box.onClick();
        break;
      }
    }
    return;
  }

  if (game.debug && e.button === 0) {
    debugDrag.active = true;
    debugDrag.startX = Math.round(cx + game.camX);
    debugDrag.startY = Math.round(cy + game.camY);
    debugDrag.curX = debugDrag.startX;
    debugDrag.curY = debugDrag.startY;
    return;
  }

  mouse.screenX = Math.max(0, Math.min(W, cx));
  mouse.screenY = Math.max(0, Math.min(H, cy));
  if (e.button === 0) mouse.leftDown = true;
  if (e.button === 2) mouse.rightDown = true;
  if (e.button === 1) mouse.middleDown = true;
});

window.addEventListener("mouseup", e => {
  if (debugDrag.active && e.button === 0) {
    debugDrag.active = false;
    const x = Math.min(debugDrag.startX, debugDrag.curX);
    const y = Math.min(debugDrag.startY, debugDrag.curY);
    const w = Math.abs(debugDrag.curX - debugDrag.startX);
    const h = Math.abs(debugDrag.curY - debugDrag.startY);
    if (w > 4 && h > 4) {
      debugDrag.lastJson = `{ "x": ${x}, "y": ${y}, "w": ${w}, "h": ${h} }`;
      console.log("Stage JSON Box:", debugDrag.lastJson);
    }
    return;
  }
  if (e.button === 0) mouse.leftDown = false;
  if (e.button === 2) mouse.rightDown = false;
  if (e.button === 1) mouse.middleDown = false;
});

window.addEventListener("keydown", e => {
  SFX.unlock();
  touchUI.classList.remove("active");
  keys[e.code] = true;

  if (game.state === "SELECT") {
    if (e.code === "Digit1") toggleTraitSelection("blind");
    else if (e.code === "Digit2") toggleTraitSelection("prosthesis");
    else if (e.code === "Digit3") toggleTraitSelection("deaf");
    else if (e.code === "Digit4") toggleTraitSelection("tremor");
    else if (e.code === "Digit5") toggleTraitSelection("asthma");
    else if (e.code === "KeyN") setDifficulty("NORMAL");
    else if (e.code === "KeyH") setDifficulty("HARD");
    else if (e.code === "KeyU") setDifficulty("ULTIMATE");
    else if ((e.code === "Enter" || e.code === "Space") && setup.selected.length === requiredTraitCount()) {
      startStageWithSelectedTraits();
    }
    return;
  }

  if (e.code === "Tab") {
    e.preventDefault();
    game.state = "SELECT";
    SFX.syncBgm();
  } else if (e.code === "F2") {
    e.preventDefault();
    game.debug = !game.debug;
  } else if (e.code === "KeyM") {
    SFX.muted = !SFX.muted;
    SFX.syncBgm();
  } else if (e.code === "KeyR" && (game.state === "GAMEOVER" || game.state === "VICTORY")) {
    startStageWithSelectedTraits();
  }
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});

function setupTouchControls() {
  const stickBase = document.getElementById("stick-base");
  const stickKnob = document.getElementById("stick-knob");
  let stickTouchId = null;

  canvas.addEventListener("touchstart", e => {
    SFX.unlock();
    if (e.changedTouches.length > 0) {
      const t = e.changedTouches[0];
      const rect = canvas.getBoundingClientRect();
      const cx = ((t.clientX - rect.left) / rect.width) * W;
      const cy = ((t.clientY - rect.top) / rect.height) * H;
      if (game.state === "SELECT") {
        e.preventDefault();
        for (const box of setup.uiBoxes) {
          if (cx >= box.x && cx <= box.x + box.w && cy >= box.y && cy <= box.y + box.h) {
            box.onClick();
            break;
          }
        }
        return;
      }
      touchUI.classList.add("active");
      mouse.screenX = Math.max(0, Math.min(W, cx));
      mouse.screenY = Math.max(0, Math.min(H, cy));
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", e => {
    if (game.state === "PLAY" && e.changedTouches.length > 0) {
      const t = e.changedTouches[0];
      const rect = canvas.getBoundingClientRect();
      mouse.screenX = Math.max(0, Math.min(W, ((t.clientX - rect.left) / rect.width) * W));
      mouse.screenY = Math.max(0, Math.min(H, ((t.clientY - rect.top) / rect.height) * H));
    }
  }, { passive: true });

  stickBase.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    stickTouchId = t.identifier;
    updateStick(t.clientX, t.clientY);
  }, { passive: false });

  stickBase.addEventListener("touchmove", e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouchId) updateStick(t.clientX, t.clientY);
    }
  }, { passive: false });

  const endStick = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouchId) {
        stickTouchId = null;
        touchState.left = touchState.right = touchState.up = touchState.down = false;
        stickKnob.style.transform = "translate(0px, 0px)";
      }
    }
  };
  stickBase.addEventListener("touchend", endStick);
  stickBase.addEventListener("touchcancel", endStick);

  function updateStick(cx, cy) {
    const rect = stickBase.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    let dx = cx - centerX;
    let dy = cy - centerY;
    const maxR = 42;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    const dead = 14;
    touchState.left  = dx < -dead;
    touchState.right = dx > dead;
    touchState.up    = dy < -dead;
    touchState.down  = dy > dead;
  }

  function bindBtn(id, field) {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", e => {
      e.preventDefault();
      SFX.unlock();
      touchState[field] = true;
      el.classList.add("pressed");
    }, { passive: false });
    const release = e => {
      e.preventDefault();
      touchState[field] = false;
      el.classList.remove("pressed");
    };
    el.addEventListener("touchend", release);
    el.addEventListener("touchcancel", release);
  }

  bindBtn("btn-jump", "jump");
  bindBtn("btn-gun",  "gun");
  bindBtn("btn-bone", "bone");
  bindBtn("btn-hat",  "hat");
}
setupTouchControls();

function sampleRawState() {
  const aHeld = !!(keys["KeyA"] || keys["ArrowLeft"] || touchState.left);
  const dHeld = !!(keys["KeyD"] || keys["ArrowRight"] || touchState.right);
  const wHeld = !!(keys["KeyW"] || keys["ArrowUp"] || touchState.up);
  const sHeld = !!(keys["KeyS"] || keys["ArrowDown"] || touchState.down);
  const spaceHeld = !!(keys["Space"] || touchState.jump);

  return {
    aHeld,
    dHeld,
    wHeld,
    sHeld,
    jumpHeld: wHeld || spaceHeld,
    gunHeld:  !!(mouse.leftDown || keys["KeyJ"] || touchState.gun),
    boneHeld: !!(mouse.rightDown || keys["KeyE"] || keys["KeyC"] || touchState.bone),
    hatHeld:  !!(mouse.middleDown || keys["KeyF"] || keys["ShiftLeft"] || keys["ShiftRight"] || touchState.hat)
  };
}

function getEffectiveInput() {
  const raw = sampleRawState();
  let state = raw;

  if (hero.traits.deaf) {
    const delaySec = hero.stats?.inputDelaySec ?? 0.40;
    inputDelayBuffer.push({ time: game.elapsedTime, raw });
    const targetTime = game.elapsedTime - delaySec;
    while (inputDelayBuffer.length > 1 && inputDelayBuffer[1].time <= targetTime) {
      inputDelayBuffer.shift();
    }
    if (inputDelayBuffer[0].time <= targetTime) {
      state = inputDelayBuffer[0].raw;
    } else {
      state = {
        aHeld: false, dHeld: false, wHeld: false, sHeld: false,
        jumpHeld: false, gunHeld: false, boneHeld: false, hatHeld: false
      };
    }
  }

  const effective = {
    ...state,
    jumpPressed: state.jumpHeld && !prevEffectiveInput.jumpHeld,
    bonePressed: state.boneHeld && !prevEffectiveInput.boneHeld,
    hatPressed:  state.hatHeld  && !prevEffectiveInput.hatHeld
  };
  prevEffectiveInput = state;
  return effective;
}

/* ============================================================================
 * 6. GAME STATE & ONE-WAY SCREEN LOADING (001 -> 002 -> FINAL)
 * ========================================================================== */
const game = {
  state: "SELECT", // SELECT | PLAY | SCREEN_FADE | GAMEOVER | VICTORY
  debug: false,
  elapsedTime: 0,
  screenIdx: 0,
  activeScreen: null,
  worldW: W,
  worldH: H,
  stageTimer: 600,
  score: 0,
  shakeTimer: 0,
  fadeTimer: 0,
  camX: 0,
  camY: 0,
  aimWorldX: 300,
  aimWorldY: 480,
  bullets: [],
  bones: [],
  missiles: [],
  particles: []
};

const hero = {
  x: 112, y: 492, w: 34, h: 56,
  vx: 0, vy: 0, facing: 1, aimAngle: 0,
  grounded: false, onLadder: false, dropThroughTimer: 0,
  hp: 100, maxHp: 100, invulnTimer: 0,
  gunCooldown: 0, bones: 0,
  hasMissileHat: false, hatCooldown: 0, hatMaxCooldown: 4.5,
  asthma: 0, asthmaStun: 0, asthmaPending: false,
  animState: "IDLE", animTimer: 0,
  traits: { blind: true, prosthesis: false, deaf: false, tremor: false, asthma: false },
  stats: computeHunterStats(["blind"]),
  identity: { code: "1", ...FALLBACK_TRAITS_DATA.roster["1"] }
};

function loadScreenByIndex(idx) {
  const screens = stageManager.data.screens;
  const tpl = screens[idx];
  game.screenIdx = idx;

  game.activeScreen = {
    id: tpl.id,
    image: tpl.image || null,
    pageLeft: tpl.pageLeft || String(26 + idx * 2),
    pageRight: tpl.pageRight || String(27 + idx * 2),
    isFinal: Boolean(tpl.isFinal || idx === screens.length - 1),
    spawn: { ...(tpl.spawn || { x: 64, y: 492 }) },
    exit: tpl.exit ? { ...tpl.exit } : null,
    solids: (tpl.solids || []).map(s => ({ ...s })),
    oneWay: (tpl.oneWay || []).map(p => ({ ...p })),
    ladders: (tpl.ladders || []).map(l => ({ ...l })),
    pickups: (tpl.pickups || []).map(p => ({ w: 28, h: 24, ...p, collected: false })),
    enemies: (tpl.enemies || []).map(e => {
      if (e.kind === "giant") {
        return {
          kind: "giant",
          x: e.x, y: e.y, w: e.w || 62, h: e.h || 100,
          vx: e.vx || -55, minX: e.minX, maxX: e.maxX, facing: -1,
          hp: e.hp || 150, maxHp: e.hp || 150,
          animTimer: 0, hurtTimer: 0, alive: true,
          aiState: "WALK", aiTimer: 0, weaponAngle: -0.35, weaponLength: 76, struckThisSwing: false
        };
      }
      return {
        kind: "blade",
        x: e.x, y: e.y, w: e.w || 30, h: e.h || 52,
        vx: e.vx || -80, minX: e.minX, maxX: e.maxX, facing: -1,
        hp: e.hp || 40, maxHp: e.hp || 40,
        animTimer: 0, hurtTimer: 0, alive: true, slashTimer: 0
      };
    })
  };

  const bgImg = stageManager.bgImages[tpl.id];
  game.worldW = (bgImg && bgImg.loaded && bgImg.naturalWidth > W) ? bgImg.naturalWidth : (tpl.width || W);
  game.worldH = (bgImg && bgImg.loaded && bgImg.naturalHeight > H) ? bgImg.naturalHeight : (tpl.height || H);

  hero.x = game.activeScreen.spawn.x;
  hero.y = game.activeScreen.spawn.y;
  hero.vx = 0;
  hero.vy = 0;
  hero.onLadder = false;
  hero.grounded = false;

  game.bullets.length = 0;
  game.bones.length = 0;
  game.missiles.length = 0;
  game.particles.length = 0;

  game.camX = Math.max(0, Math.min(game.worldW - W, hero.x + hero.w / 2 - W / 2));
  game.camY = Math.max(0, Math.min(game.worldH - H, hero.y + hero.h / 2 - H / 2));
}

function advanceToNextScreen() {
  const nextIdx = game.screenIdx + 1;
  if (nextIdx >= stageManager.data.screens.length) {
    game.state = "VICTORY";
    SFX.syncBgm();
    return;
  }
  game.state = "SCREEN_FADE";
  game.fadeTimer = 0.28;
  SFX.beep(580, 0.16, "triangle", 0.09, 880);
  loadScreenByIndex(nextIdx);
}

function startStageWithSelectedTraits() {
  const chosen = setup.selected.slice(0, requiredTraitCount());
  if (chosen.length !== requiredTraitCount()) return;

  const computed = computeHunterStats(chosen);
  hero.traits = computed.active;
  hero.stats = computed;
  hero.identity = buildHunterIdentity(chosen);

  game.state = "PLAY";
  game.elapsedTime = 0;
  game.stageTimer = stageManager.data.timeLimit || 600;
  game.score = 0;
  inputDelayBuffer.length = 0;
  prevEffectiveInput = {
    left: false, right: false, up: false, down: false,
    jumpHeld: false, gunHeld: false, boneHeld: false, hatHeld: false
  };

  Object.assign(hero, {
    hp: computed.maxHp, maxHp: computed.maxHp,
    invulnTimer: 0, gunCooldown: 0, bones: 0,
    hasMissileHat: false, hatCooldown: 0,
    asthma: 0, asthmaStun: 0, asthmaPending: false,
    animState: "IDLE", animTimer: 0
  });

  loadScreenByIndex(0);
  SFX.syncBgm();
}

/* ============================================================================
 * 7. PHYSICS, CURSOR AIMING, BULLET ARC & TRAIT MECHANICS (60 FPS)
 * ========================================================================== */
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function spawnParticles(x, y, color, count = 8, speed = 160) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (0.3 + Math.random() * 0.7) * speed;
    game.particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 40,
      life: 0.25 + Math.random() * 0.25,
      maxLife: 0.5,
      color,
      size: 3 + Math.random() * 3
    });
  }
}

function damageHero(amount, knockDir) {
  if (hero.invulnTimer > 0 || game.state !== "PLAY") return;
  hero.hp = Math.max(0, hero.hp - amount);
  hero.invulnTimer = 1.0;
  hero.onLadder = false;
  hero.vx = knockDir * 210;
  hero.vy = -250;
  game.shakeTimer = 0.2;
  spawnParticles(hero.x + hero.w / 2, hero.y + hero.h / 2, "#dc2626", 12, 180);
  SFX.beep(140, 0.25, "sawtooth", 0.12, 60);

  if (hero.hp <= 0) {
    game.state = "GAMEOVER";
    SFX.syncBgm();
  }
}

function updateCamera() {
  const targetX = Math.max(0, Math.min(game.worldW - W, hero.x + hero.w / 2 - W / 2));
  const targetY = Math.max(0, Math.min(game.worldH - H, hero.y + hero.h / 2 - H / 2));
  game.camX += (targetX - game.camX) * 0.16;
  game.camY += (targetY - game.camY) * 0.16;
}

function stepHero(input, scr) {
  const GRAVITY = 1380;
  const WALK_SPEED = hero.stats.walkSpeed;
  const CLIMB_SPEED = hero.stats.climbSpeed;
  const JUMP_VEL = hero.stats.jumpVel;

  if (hero.invulnTimer > 0) hero.invulnTimer = Math.max(0, hero.invulnTimer - DT);
  if (hero.gunCooldown > 0) hero.gunCooldown = Math.max(0, hero.gunCooldown - DT);
  if (hero.hatCooldown > 0) hero.hatCooldown = Math.max(0, hero.hatCooldown - DT);
  if (hero.dropThroughTimer > 0) hero.dropThroughTimer = Math.max(0, hero.dropThroughTimer - DT);

  const jitterAmp = hero.traits.tremor ? hero.stats.aimJitterPx : 0;
  const jitterX = jitterAmp > 0 ? Math.sin(game.elapsedTime * 37) * jitterAmp + (Math.random() - 0.5) * 8 : 0;
  const jitterY = jitterAmp > 0 ? Math.cos(game.elapsedTime * 43) * jitterAmp + (Math.random() - 0.5) * 8 : 0;
  game.aimWorldX = mouse.screenX + game.camX + jitterX;
  game.aimWorldY = mouse.screenY + game.camY + jitterY;

  const shoulderX = hero.x + hero.w / 2;
  const shoulderY = hero.y + hero.h * 0.45;
  hero.aimAngle = Math.atan2(game.aimWorldY - shoulderY, game.aimWorldX - shoulderX);
  hero.facing = Math.cos(hero.aimAngle) >= 0 ? 1 : -1;

  if (hero.traits.asthma) {
    if (hero.asthmaStun > 0) {
      hero.asthmaStun = Math.max(0, hero.asthmaStun - DT);
      hero.animTimer += DT * 10;
      if (hero.asthmaStun === 0) {
        hero.asthma = 0;
        hero.asthmaPending = false;
      }
      hero.vx = 0;
      hero.vy = Math.min(hero.vy + GRAVITY * DT, 760);
      resolveCollisions(scr, true);
      return;
    }

    if (input.aHeld || input.wHeld) {
      hero.asthma = Math.min(100, hero.asthma + hero.stats.fatigueGainPerSec * DT);
      if (hero.asthma >= 100) {
        if (hero.grounded || hero.onLadder) {
          hero.asthmaStun = hero.stats.stunDurationSec;
          hero.onLadder = false;
          SFX.beep(180, 0.3, "sine", 0.09, 110);
          return;
        } else {
          hero.asthmaPending = true;
        }
      }
    } else if (!hero.asthmaPending) {
      hero.asthma = Math.max(0, hero.asthma - hero.stats.fatigueDecayPerSec * DT);
    }
  }

  const heroCenter = { x: hero.x + 6, y: hero.y + 4, w: hero.w - 12, h: hero.h };
  const ladder = scr.ladders.find(l => rectsOverlap(heroCenter, l));

  if (ladder && (input.wHeld || input.sHeld)) {
    hero.onLadder = true;
    hero.grounded = false;
    hero.vx = 0;
    hero.vy = input.wHeld ? -CLIMB_SPEED : CLIMB_SPEED;
    const targetX = ladder.x + (ladder.w - hero.w) / 2;
    hero.x += (targetX - hero.x) * 0.35;
  } else if (!ladder) {
    hero.onLadder = false;
  }

  if (!hero.onLadder) {
    const moveDir = (input.dHeld ? 1 : 0) - (input.aHeld ? 1 : 0);
    if (hero.invulnTimer < 0.75) {
      hero.vx = moveDir * WALK_SPEED;
    }
    hero.vy = Math.min(hero.vy + GRAVITY * DT, 760);
  } else if (!input.wHeld && !input.sHeld) {
    hero.vy = 0;
    const moveDir = (input.dHeld ? 1 : 0) - (input.aHeld ? 1 : 0);
    hero.vx = moveDir * WALK_SPEED * 0.75;
  }

  if (input.jumpPressed && input.sHeld && hero.grounded && !hero.onLadder) {
    hero.dropThroughTimer = 0.18;
    hero.grounded = false;
    hero.y += 4;
  } else if (input.jumpPressed && hero.grounded && !hero.onLadder) {
    hero.grounded = false;
    hero.vy = JUMP_VEL;
    SFX.beep(320, 0.11, "square", 0.06, 540);
  }

  resolveCollisions(scr, false);
  hero.x = Math.max(0, Math.min(game.worldW - hero.w, hero.x));

  if (hero.traits.asthma && hero.asthmaPending && hero.grounded) {
    hero.asthmaPending = false;
    hero.asthmaStun = hero.stats.stunDurationSec;
    hero.vx = 0;
    SFX.beep(180, 0.3, "sine", 0.09, 110);
    return;
  }

  if (scr.exit && rectsOverlap(hero, scr.exit)) {
    advanceToNextScreen();
    return;
  }

  if (hero.onLadder) {
    hero.animState = "CLIMB";
    if (Math.abs(hero.vy) > 1) hero.animTimer += DT * 9;
  } else if (!hero.grounded) {
    hero.animState = "JUMP";
  } else if (Math.abs(hero.vx) > 5) {
    hero.animState = "RUN";
    hero.animTimer += DT * 12;
  } else {
    hero.animState = "IDLE";
    hero.animTimer = 0;
  }

  const spreadAngle = hero.traits.tremor ? (Math.random() - 0.5) * hero.stats.spreadRad : 0;
  const fireAngle = hero.aimAngle + spreadAngle;
  const dirX = Math.cos(fireAngle);
  const dirY = Math.sin(fireAngle);
  const muzzleX = shoulderX + dirX * 18;
  const muzzleY = shoulderY + dirY * 18;

  if (input.gunHeld && hero.gunCooldown <= 0) {
    hero.gunCooldown = 0.11;
    const bulletSpeed = hero.stats.bulletSpeed;
    game.bullets.push({
      x: muzzleX, y: muzzleY,
      vx: dirX * bulletSpeed, vy: dirY * bulletSpeed,
      traveled: 0,
      dropStartDist: HALF_W * hero.stats.bulletDropRatio,
      damage: 10
    });
    SFX.beep(780, 0.045, "square", 0.05, 320);
  }

  if (input.bonePressed && hero.bones > 0) {
    hero.bones--;
    const boneSpeed = 480;
    game.bones.push({
      x: muzzleX, y: muzzleY - 4,
      vx: dirX * boneSpeed + hero.vx * 0.15,
      vy: dirY * boneSpeed - 150,
      rot: 0, damage: 55
    });
    SFX.beep(440, 0.12, "triangle", 0.09, 680);
  }

  if (input.hatPressed && hero.hasMissileHat && hero.hatCooldown <= 0) {
    hero.hatCooldown = hero.hatMaxCooldown;
    game.missiles.push({
      x: shoulderX, y: hero.y - 4,
      vx: dirX * 520, vy: dirY * 520 - 70,
      targetVx: dirX * 560, targetVy: dirY * 560,
      timer: 0, damage: 110, splashRadius: 74
    });
    SFX.beep(260, 0.22, "sawtooth", 0.1, 720);
  }
}

function resolveCollisions(scr, stunned) {
  hero.x += hero.vx * DT;
  for (const s of scr.solids) {
    if (rectsOverlap(hero, s)) {
      if (hero.vx > 0) hero.x = s.x - hero.w;
      else if (hero.vx < 0) hero.x = s.x + s.w;
      hero.vx = 0;
    }
  }

  const prevBottom = hero.y + hero.h;
  hero.y += hero.vy * DT;
  hero.grounded = false;

  for (const s of scr.solids) {
    if (rectsOverlap(hero, s)) {
      if (hero.vy > 0) {
        hero.y = s.y - hero.h;
        hero.vy = 0;
        hero.grounded = true;
      } else if (hero.vy < 0) {
        hero.y = s.y + s.h;
        hero.vy = 0;
      }
    }
  }

  if (!hero.onLadder && hero.vy >= 0 && (stunned || hero.dropThroughTimer <= 0)) {
    for (const p of scr.oneWay) {
      if (
        hero.x + hero.w > p.x &&
        hero.x < p.x + p.w &&
        prevBottom <= p.y + 6 &&
        hero.y + hero.h >= p.y
      ) {
        hero.y = p.y - hero.h;
        hero.vy = 0;
        hero.grounded = true;
      }
    }
  }
}

function stepProjectilesAndPickups(scr) {
  for (const p of scr.pickups) {
    if (p.collected) continue;
    if (rectsOverlap(hero, p)) {
      p.collected = true;
      if (p.type === "chicken") {
        hero.hp = Math.min(hero.maxHp, hero.hp + 45);
        hero.bones = 4;
        hero.asthma = 0;
        game.score += 200;
        spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#e08a2e", 10, 140);
        SFX.beep(520, 0.18, "triangle", 0.1, 880);
      } else if (p.type === "hat") {
        hero.hasMissileHat = true;
        hero.hatCooldown = 0;
        game.score += 500;
        spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#f5c518", 14, 160);
        SFX.beep(440, 0.25, "square", 0.1, 990);
      } else if (p.type === "crown") {
        game.score += 250;
        spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#dc2626", 10, 140);
        SFX.beep(660, 0.14, "sine", 0.1, 1040);
      } else if (p.type === "treasure") {
        const diffBonus = setup.difficulty === "ULTIMATE" ? 6000 : (setup.difficulty === "HARD" ? 3000 : 1000);
        game.score += 2000 + diffBonus + Math.floor(game.stageTimer) * 5;
        spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#ffd700", 24, 220);
        SFX.beep(523, 0.4, "square", 0.12, 1046);
        game.state = "VICTORY";
        SFX.syncBgm();
      }
    }
  }

  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    if (b.traveled >= b.dropStartDist) b.vy += 1850 * DT;
    else b.vy += 90 * DT;

    const stepX = b.vx * DT;
    const stepY = b.vy * DT;
    b.x += stepX;
    b.y += stepY;
    b.traveled += Math.hypot(stepX, stepY);

    const hitSolid = scr.solids.some(s => b.x >= s.x && b.x <= s.x + s.w && b.y >= s.y && b.y <= s.y + s.h);
    if (hitSolid || b.y > game.worldH || b.x < 0 || b.x > game.worldW) {
      spawnParticles(b.x, b.y, "#1e3a8a", 4, 80);
      game.bullets.splice(i, 1);
      continue;
    }

    let hitEnemy = false;
    for (const e of scr.enemies) {
      if (!e.alive) continue;
      if (b.x >= e.x && b.x <= e.x + e.w && b.y >= e.y && b.y <= e.y + e.h) {
        damageEnemy(e, b.damage, b.x, b.y);
        hitEnemy = true;
        break;
      }
    }
    if (hitEnemy) game.bullets.splice(i, 1);
  }

  for (let i = game.bones.length - 1; i >= 0; i--) {
    const bone = game.bones[i];
    bone.vy += 760 * DT;
    bone.x += bone.vx * DT;
    bone.y += bone.vy * DT;
    bone.rot += 15 * DT;

    const hitSolid = scr.solids.some(s => bone.x >= s.x && bone.x <= s.x + s.w && bone.y >= s.y && bone.y <= s.y + s.h);
    if (hitSolid || bone.y > game.worldH || bone.x < -40 || bone.x > game.worldW + 40) {
      spawnParticles(bone.x, bone.y, "#f8fafc", 8, 130);
      SFX.beep(220, 0.08, "triangle", 0.07, 120);
      game.bones.splice(i, 1);
      continue;
    }

    let hitEnemy = false;
    for (const e of scr.enemies) {
      if (!e.alive) continue;
      if (bone.x >= e.x - 6 && bone.x <= e.x + e.w + 6 && bone.y >= e.y - 6 && bone.y <= e.y + e.h + 6) {
        damageEnemy(e, bone.damage, bone.x, bone.y);
        spawnParticles(bone.x, bone.y, "#fef08a", 12, 170);
        hitEnemy = true;
        break;
      }
    }
    if (hitEnemy) game.bones.splice(i, 1);
  }

  for (let i = game.missiles.length - 1; i >= 0; i--) {
    const m = game.missiles[i];
    m.timer += DT;
    if (m.timer > 0.12) {
      m.vx += (m.targetVx - m.vx) * 0.25;
      m.vy += (m.targetVy - m.vy) * 0.25;
    }
    m.x += m.vx * DT;
    m.y += m.vy * DT;

    if (m.timer % 0.03 < DT) spawnParticles(m.x, m.y, "#fb923c", 2, 40);

    const outOfWorld = m.x < 0 || m.x > game.worldW || m.y < 0 || m.y > game.worldH;
    const hitSolid = scr.solids.some(s => m.x >= s.x && m.x <= s.x + s.w && m.y >= s.y && m.y <= s.y + s.h);
    const hitEnemy = scr.enemies.some(e => e.alive && m.x >= e.x && m.x <= e.x + e.w && m.y >= e.y && m.y <= e.y + e.h);

    if (outOfWorld || hitSolid || hitEnemy) {
      game.shakeTimer = 0.22;
      spawnParticles(m.x, m.y, "#ef4444", 18, 230);
      SFX.beep(110, 0.26, "sawtooth", 0.14, 42);
      for (const e of scr.enemies) {
        if (!e.alive) continue;
        const dist = Math.hypot(e.x + e.w / 2 - m.x, e.y + e.h / 2 - m.y);
        if (dist <= m.splashRadius + e.w * 0.5) {
          damageEnemy(e, m.damage, m.x, m.y);
        }
      }
      game.missiles.splice(i, 1);
    }
  }
}

function damageEnemy(enemy, dmg, hitX, hitY) {
  enemy.hp -= dmg;
  enemy.hurtTimer = 0.14;
  spawnParticles(hitX, hitY, "#dc2626", 6, 120);
  SFX.beep(190, 0.07, "square", 0.07, 110);

  if (enemy.hp <= 0) {
    enemy.alive = false;
    game.score += enemy.kind === "giant" ? 800 : 250;
    spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, "#1e293b", 16, 200);
    SFX.beep(150, 0.22, "sawtooth", 0.1, 55);
  }
}

function stepEnemies(scr) {
  for (const e of scr.enemies) {
    if (!e.alive) continue;
    if (e.hurtTimer > 0) e.hurtTimer = Math.max(0, e.hurtTimer - DT);

    if (e.kind === "blade") {
      e.animTimer += DT;
      e.x += e.vx * DT;
      if (e.x <= e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); e.facing = 1; }
      if (e.x + e.w >= e.maxX) { e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); e.facing = -1; }

      const dist = Math.abs((hero.x + hero.w / 2) - (e.x + e.w / 2));
      const sameFloor = Math.abs((hero.y + hero.h) - (e.y + e.h)) < 60;
      if (dist < 68 && sameFloor) {
        e.facing = hero.x < e.x ? -1 : 1;
        e.slashTimer = 0.22;
      } else if (e.slashTimer > 0) {
        e.slashTimer = Math.max(0, e.slashTimer - DT);
      }

      if (rectsOverlap(hero, e)) damageHero(16, hero.x < e.x ? -1 : 1);
    } else if (e.kind === "giant") {
      const distToHero = Math.abs((hero.x + hero.w / 2) - (e.x + e.w / 2));
      const sameHeight = Math.abs((hero.y + hero.h) - (e.y + e.h)) < 80;

      if (e.aiState === "WALK") {
        e.animTimer += DT;
        e.x += e.vx * DT;
        e.weaponAngle = -0.35 + Math.sin(Math.floor(e.animTimer * 8)) * 0.12;
        if (e.x <= e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); e.facing = 1; }
        if (e.x + e.w >= e.maxX) { e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); e.facing = -1; }

        if (distToHero < 110 && sameHeight) {
          e.facing = hero.x < e.x ? -1 : 1;
          e.aiState = "WINDUP";
          e.aiTimer = 0.38;
        }
      } else if (e.aiState === "WINDUP") {
        e.aiTimer -= DT;
        e.weaponAngle = -1.35;
        if (e.aiTimer <= 0) {
          e.aiState = "STRIKE";
          e.aiTimer = 0.16;
          e.struckThisSwing = false;
          SFX.beep(130, 0.14, "sawtooth", 0.09, 70);
        }
      } else if (e.aiState === "STRIKE") {
        e.aiTimer -= DT;
        e.weaponAngle = 1.45;
        if (!e.struckThisSwing) {
          const axeBox = {
            x: e.facing === 1 ? e.x + e.w * 0.5 : e.x + e.w * 0.5 - e.weaponLength,
            y: e.y + e.h * 0.22,
            w: e.weaponLength,
            h: e.h * 0.75
          };
          if (rectsOverlap(hero, axeBox)) {
            e.struckThisSwing = true;
            damageHero(28, e.facing);
          }
        }
        if (e.aiTimer <= 0) {
          e.aiState = "RECOVER";
          e.aiTimer = 0.45;
        }
      } else if (e.aiState === "RECOVER") {
        e.aiTimer -= DT;
        e.weaponAngle = 0.9;
        if (e.aiTimer <= 0) e.aiState = "WALK";
      }

      if (rectsOverlap(hero, e)) damageHero(18, hero.x < e.x ? -1 : 1);
    }
  }
}

function stepParticles() {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= DT;
    p.vy += 420 * DT;
    p.x += p.vx * DT;
    p.y += p.vy * DT;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

/* ============================================================================
 * 8. RENDERING: SCREEN 001, STACKABLE MOVABLE CHARACTER & SELECT SCREEN
 * ========================================================================== */
function drawActiveScreenBackground(scr) {
  const customBg = stageManager.bgImages[scr.id];
  if (customBg && customBg.loaded) {
    ctx.drawImage(customBg, 0, 0, game.worldW, game.worldH);
    return;
  }

  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0.00, "#ede7d8");
  grad.addColorStop(0.47, "#f7f4eb");
  grad.addColorStop(0.50, "#d8d0be");
  grad.addColorStop(0.53, "#f7f4eb");
  grad.addColorStop(1.00, "#ede7d8");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  drawRuledPage(0, 0, scr.pageLeft, true);
  drawRuledPage(HALF_W, 0, scr.pageRight, false);

  ctx.strokeStyle = "rgba(80, 75, 65, 0.45)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(HALF_W, 0);
  ctx.lineTo(HALF_W, H);
  ctx.stroke();

  for (const s of scr.solids) {
    ctx.fillStyle = s.hatched ? "#f2ede0" : "#1e293b";
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 2.5;
    ctx.strokeRect(s.x, s.y, s.w, s.h);

    if (s.hatched) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(s.x, s.y, s.w, s.h);
      ctx.clip();
      ctx.strokeStyle = "rgba(30, 41, 59, 0.65)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let hx = s.x - s.h; hx < s.x + s.w + s.h; hx += 34) {
        ctx.moveTo(hx + 16, s.y + 4);
        ctx.lineTo(hx - 12, s.y + s.h - 4);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  for (const p of scr.oneWay) {
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(p.x, p.y, p.w, 4);
    ctx.fillRect(p.x, p.y + 7, p.w, 2.5);
  }

  for (const l of scr.ladders) {
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(l.x + 5, l.y);
    ctx.lineTo(l.x + 5, l.y + l.h);
    ctx.moveTo(l.x + l.w - 5, l.y);
    ctx.lineTo(l.x + l.w - 5, l.y + l.h);
    for (let ry = l.y + 14; ry < l.y + l.h; ry += 22) {
      ctx.moveTo(l.x + 5, ry);
      ctx.lineTo(l.x + l.w - 5, ry);
    }
    ctx.stroke();
  }
}

function drawRuledPage(px, py, pageNum, isLeft) {
  const padX = 28;
  const headerY = py + 52;
  const footerY = py + H - 28;
  const lineGap = 24;

  ctx.fillStyle = "rgba(110, 115, 125, 0.75)";
  ctx.font = "11px sans-serif";
  ctx.fillText("DATUM/DATE", isLeft ? px + padX : px + HALF_W - 145, py + 44);

  ctx.strokeStyle = "rgba(130, 145, 165, 0.35)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let y = headerY; y <= footerY; y += lineGap) {
    ctx.moveTo(px + padX, y);
    ctx.lineTo(px + HALF_W - padX, y);
  }
  ctx.stroke();

  ctx.fillStyle = "rgba(110, 115, 125, 0.8)";
  ctx.font = "11px monospace";
  ctx.fillText(String(pageNum), isLeft ? px + padX + 6 : px + HALF_W - padX - 18, footerY + 16);
}

function drawScreenEntities(scr) {
  if (scr.exit) {
    const pulse = 0.55 + Math.sin(game.elapsedTime * 6) * 0.35;
    ctx.save();
    ctx.strokeStyle = `rgba(22, 163, 74, ${pulse})`;
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 2;
    ctx.strokeRect(scr.exit.x, scr.exit.y, scr.exit.w, scr.exit.h);
    ctx.setLineDash([]);
    ctx.fillStyle = "#15803d";
    ctx.font = "bold 10px monospace";
    ctx.textAlign = "center";
    ctx.fillText(scr.exit.hint || "EXIT", scr.exit.x + scr.exit.w / 2, scr.exit.y - 6);
    ctx.textAlign = "left";
    ctx.restore();
  }

  for (const p of scr.pickups) {
    if (p.collected) continue;
    const bob = Math.sin(game.elapsedTime * 5) * 3;
    if (p.type === "crown") {
      if (EXTRA_SPRITES.crown.loaded) {
        ctx.drawImage(EXTRA_SPRITES.crown, p.x, p.y + bob, p.w, p.h);
      } else {
        ctx.strokeStyle = "#dc2626";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(p.x + 3, p.y + p.h - 3 + bob);
        ctx.lineTo(p.x + 2, p.y + 5 + bob);
        ctx.lineTo(p.x + 8, p.y + 11 + bob);
        ctx.lineTo(p.x + 13, p.y + 2 + bob);
        ctx.lineTo(p.x + 18, p.y + 11 + bob);
        ctx.lineTo(p.x + 24, p.y + 5 + bob);
        ctx.lineTo(p.x + 23, p.y + p.h - 3 + bob);
        ctx.closePath();
        ctx.stroke();
      }
    } else if (p.type === "chicken") {
      if (EXTRA_SPRITES.chicken.loaded) {
        ctx.drawImage(EXTRA_SPRITES.chicken, p.x, p.y + bob, p.w, p.h);
      } else {
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(p.x + 17, p.y + 22 + bob, 16, 5, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#d97706";
        ctx.beginPath();
        ctx.ellipse(p.x + 15, p.y + 15 + bob, 11, 7, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#fffbeb";
        ctx.fillRect(p.x + 24, p.y + 9 + bob, 8, 4);
        ctx.strokeRect(p.x + 24, p.y + 9 + bob, 8, 4);
      }
    } else if (p.type === "hat") {
      if (EXTRA_SPRITES.hat.loaded) {
        ctx.drawImage(EXTRA_SPRITES.hat, p.x, p.y + bob, p.w, p.h);
      } else {
        ctx.fillStyle = "#eab308";
        ctx.fillRect(p.x + 4, p.y + 4 + bob, 22, 12);
        ctx.fillRect(p.x, p.y + 15 + bob, 30, 5);
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(p.x + 12, p.y + bob, 6, 6);
      }
    } else if (p.type === "treasure") {
      if (EXTRA_SPRITES.treasure.loaded) {
        ctx.drawImage(EXTRA_SPRITES.treasure, p.x, p.y, p.w, p.h);
      } else {
        ctx.fillStyle = "#b45309";
        ctx.fillRect(p.x, p.y + 8, p.w, p.h - 8);
        ctx.fillStyle = "#fbbf24";
        ctx.fillRect(p.x - 2, p.y + 2, p.w + 4, 9);
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y + 2, p.w, p.h - 2);
      }
    }
  }

  for (const e of scr.enemies) {
    if (!e.alive) continue;
    if (e.kind === "blade") drawBladeEnemy(e);
    else if (e.kind === "giant") drawAxeGiant(e);
  }
}

function drawBladeEnemy(e) {
  const cx = e.x + e.w / 2;
  const step = Math.sin(e.animTimer * 12) * 5;
  ctx.save();
  if (EXTRA_SPRITES.blade.loaded) {
    ctx.translate(cx, e.y + e.h);
    ctx.scale(e.facing, 1);
    ctx.drawImage(EXTRA_SPRITES.blade, -e.w / 2, -e.h, e.w, e.h);
    ctx.restore();
    return;
  }
  ctx.strokeStyle = e.hurtTimer > 0 ? "#dc2626" : "#1e293b";
  ctx.lineWidth = 2.4;

  ctx.beginPath();
  ctx.arc(cx, e.y + 9, 7, 0, Math.PI * 2);
  ctx.moveTo(cx, e.y + 16);
  ctx.lineTo(cx, e.y + 34);
  ctx.moveTo(cx, e.y + 34);
  ctx.lineTo(cx - 7 + step, e.y + e.h);
  ctx.moveTo(cx, e.y + 34);
  ctx.lineTo(cx + 7 - step, e.y + e.h);
  const handX = cx + e.facing * 10;
  const handY = e.y + 22;
  ctx.moveTo(cx, e.y + 21);
  ctx.lineTo(handX, handY);
  ctx.stroke();

  const slashTilt = e.slashTimer > 0 ? e.facing * 0.9 : 0;
  ctx.save();
  ctx.translate(handX, handY);
  ctx.rotate(slashTilt);
  ctx.fillStyle = "#cbd5e1";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(e.facing * 10, -12, e.facing * 3, -22);
  ctx.lineTo(-e.facing * 2, -2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawAxeGiant(g) {
  ctx.save();
  const step = Math.floor(g.animTimer * 9);
  const bobY = g.aiState === "WALK" ? (step % 2 === 0 ? -4 : 0) : 0;
  const tilt = g.aiState === "WALK" ? (step % 2 === 0 ? -0.05 : 0.05) : (g.aiState === "WINDUP" ? -0.14 : 0.08);

  ctx.translate(g.x + g.w / 2, g.y + g.h + bobY);
  ctx.scale(g.facing, 1);
  ctx.rotate(tilt);

  if (EXTRA_SPRITES.giant.loaded) {
    ctx.drawImage(EXTRA_SPRITES.giant, -g.w / 2, -g.h, g.w, g.h);
  } else {
    ctx.strokeStyle = g.hurtTimer > 0 ? "#dc2626" : "#1e293b";
    ctx.fillStyle = g.hurtTimer > 0 ? "#fecaca" : "#e2e8f0";
    ctx.lineWidth = 2.6;

    ctx.fillRect(-18, -32, 13, 32);
    ctx.strokeRect(-18, -32, 13, 32);
    ctx.fillRect(5, -32, 13, 32);
    ctx.strokeRect(5, -32, 13, 32);
    ctx.fillRect(-24, -76, 48, 44);
    ctx.strokeRect(-24, -76, 48, 44);
    ctx.strokeRect(-33, -72, 9, 32);

    ctx.beginPath();
    ctx.arc(0, -88, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-6, -91); ctx.lineTo(-2, -91);
    ctx.moveTo(2, -91);  ctx.lineTo(6, -91);
    ctx.moveTo(-5, -82); ctx.lineTo(5, -83);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(18, -62);
  ctx.rotate(g.weaponAngle);
  if (EXTRA_SPRITES.giantAxe.loaded) {
    ctx.drawImage(EXTRA_SPRITES.giantAxe, -6, -g.weaponLength, 26, g.weaponLength);
  } else {
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.lineTo(0, -g.weaponLength);
    ctx.stroke();

    ctx.fillStyle = "#94a3b8";
    ctx.beginPath();
    ctx.moveTo(0, -g.weaponLength + 4);
    ctx.lineTo(22, -g.weaponLength - 8);
    ctx.quadraticCurveTo(26, -g.weaponLength + 10, 20, -g.weaponLength + 24);
    ctx.lineTo(0, -g.weaponLength + 16);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  if (g.aiState === "STRIKE") {
    ctx.strokeStyle = "rgba(220, 38, 38, 0.7)";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, 0, g.weaponLength, -1.7, 0.3);
    ctx.stroke();
  }
  ctx.restore();
  ctx.restore();

  ctx.fillStyle = "#1e293b";
  ctx.fillRect(g.x, g.y - 12, g.w, 6);
  ctx.fillStyle = "#dc2626";
  ctx.fillRect(g.x + 1, g.y - 11, (g.w - 2) * Math.max(0, g.hp / g.maxHp), 4);
}

function drawSpriteLayer(layer, dx, dy, dw, dh) {
  if (!layer || !layer.loaded) return false;
  const src = layer.canvas || layer.img;
  ctx.drawImage(src, dx, dy, dw, dh);
  return true;
}

function drawHero() {
  if (hero.invulnTimer > 0 && Math.floor(hero.invulnTimer * 20) % 2 === 0) return;

  const time = game.elapsedTime;
  const shakeAmp = hero.traits.tremor ? (hero.stats?.headShakePx ?? 1.5) : 0;
  const tremorX = shakeAmp > 0 ? Math.sin(time * 55) * shakeAmp : 0;
  const pantY   = hero.asthmaStun > 0 ? Math.sin(time * 16) * 2.5 : 0;

  const runBobY = hero.animState === "RUN" ? Math.abs(Math.sin(hero.animTimer)) * -3.5 : 0;
  const runTilt = hero.animState === "RUN" ? Math.sin(hero.animTimer) * 0.045 + hero.facing * 0.04 : 0;
  const climbBobX = hero.animState === "CLIMB" ? Math.sin(hero.animTimer) * 2.5 : 0;
  const jumpSquashY = hero.animState === "JUMP" ? -2.5 : 0;

  const footX = hero.x + hero.w / 2 + tremorX + climbBobX;
  const footY = hero.y + hero.h + pantY + runBobY + jumpSquashY;

  const spriteW = 54;
  const spriteH = 66;

  ctx.save();
  ctx.translate(footX, footY);
  ctx.scale(hero.facing, 1);
  ctx.rotate(runTilt);

  const hasBaseSprite = CHAR_LAYERS.base.loaded;
  if (hasBaseSprite) {
    // 1. Base standard adventurer (normal_char.jpg)
    drawSpriteLayer(CHAR_LAYERS.base, -spriteW / 2, -spriteH, spriteW, spriteH);

    // 2. Stack independent trait layers in deterministic order
    if (hero.traits.prosthesis && CHAR_LAYERS.prosthesis.loaded) {
      drawSpriteLayer(CHAR_LAYERS.prosthesis, -spriteW / 2, -spriteH, spriteW, spriteH);
    }
    if (hero.traits.blind && CHAR_LAYERS.blind.loaded) {
      drawSpriteLayer(CHAR_LAYERS.blind, -spriteW / 2, -spriteH, spriteW, spriteH);
    }
    if (hero.traits.deaf && CHAR_LAYERS.deaf.loaded) {
      drawSpriteLayer(CHAR_LAYERS.deaf, -spriteW / 2, -spriteH, spriteW, spriteH);
    }
    if (hero.traits.asthma && CHAR_LAYERS.asthma.loaded) {
      drawSpriteLayer(CHAR_LAYERS.asthma, -spriteW / 2, -spriteH, spriteW, spriteH);
    }
    if (hero.traits.tremor && CHAR_LAYERS.tremor.loaded) {
      drawSpriteLayer(CHAR_LAYERS.tremor, -spriteW / 2, -spriteH, spriteW, spriteH);
    }
  } else {
    const swing = hero.animState === "RUN" ? Math.sin(hero.animTimer) * 6 : 0;
    ctx.strokeStyle = hero.traits.prosthesis ? "#94a3b8" : "#1e293b";
    ctx.lineWidth = hero.traits.tremor ? 1.5 : 2.6;
    ctx.beginPath();
    ctx.moveTo(0, -24);
    ctx.lineTo(-7 + swing, 0);
    ctx.moveTo(0, -24);
    ctx.lineTo(7 - swing, 0);
    ctx.stroke();

    ctx.strokeStyle = "#1e293b";
    ctx.beginPath();
    ctx.moveTo(0, -41);
    ctx.lineTo(0, -24);
    ctx.stroke();

    ctx.fillStyle = "#f7f4eb";
    ctx.beginPath();
    ctx.arc(0, -48, 7.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (hero.traits.blind) {
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(-1, -50, 8, 4);
    }
    if (hero.traits.deaf) {
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(-5, -47, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Tremor: fragile thin-arm strain lines & slight gun-arm quiver (no anger marks)
  if (hero.traits.tremor) {
    const quiver = Math.sin(time * 48) * 1.4;
    ctx.strokeStyle = "rgba(100, 116, 139, 0.85)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(4, -27 + quiver);
    ctx.lineTo(13, -29 - quiver);
    ctx.moveTo(6, -24 - quiver);
    ctx.lineTo(14, -26 + quiver);
    ctx.stroke();
  }

  if (hero.traits.asthma && (hero.asthma > 35 || hero.asthmaStun > 0)) {
    const puffPhase = (time * (hero.asthmaStun > 0 ? 4 : 1.8)) % 1;
    ctx.fillStyle = `rgba(255, 255, 255, ${(1 - puffPhase) * 0.85})`;
    ctx.strokeStyle = `rgba(100, 116, 139, ${(1 - puffPhase) * 0.65})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(10 + puffPhase * 16, -45 - puffPhase * 6, 2.5 + puffPhase * 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  if (hero.hasMissileHat) {
    const ready = hero.hatCooldown <= 0;
    ctx.fillStyle = ready ? "#facc15" : "#854d0e";
    ctx.fillRect(-10, -56, 20, 4);
    ctx.fillRect(-6, -62, 12, 6);
  }

  ctx.restore();

  if (hero.traits.asthma && (hero.asthma > 2 || hero.asthmaStun > 0)) {
    const barW = 36;
    const barX = footX - barW / 2;
    const barY = footY - spriteH - 10;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(barX, barY, barW, 5);
    ctx.fillStyle = hero.asthmaStun > 0 ? "#ef4444" : (hero.asthmaPending ? "#f59e0b" : "#38bdf8");
    ctx.fillRect(barX + 1, barY + 1, (barW - 2) * (hero.asthma / 100), 3);

    if (hero.asthmaStun > 0) {
      ctx.fillStyle = "#dc2626";
      ctx.font = "bold 11px monospace";
      ctx.textAlign = "center";
      ctx.fillText("GASP!", footX, barY - 4);
      ctx.textAlign = "left";
    }
  }
}

function drawProjectilesAndAimMark() {
  ctx.fillStyle = "#1d4ed8";
  for (const b of game.bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const bone of game.bones) {
    ctx.save();
    ctx.translate(bone.x, bone.y);
    ctx.rotate(bone.rot);
    if (EXTRA_SPRITES.bone.loaded) {
      ctx.drawImage(EXTRA_SPRITES.bone, -10, -5, 20, 10);
    } else {
      ctx.fillStyle = "#fffbeb";
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 1.5;
      ctx.fillRect(-9, -2.5, 18, 5);
      ctx.strokeRect(-9, -2.5, 18, 5);
      ctx.beginPath();
      ctx.arc(-9, -3, 3, 0, Math.PI * 2);
      ctx.arc(-9, 3, 3, 0, Math.PI * 2);
      ctx.arc(9, -3, 3, 0, Math.PI * 2);
      ctx.arc(9, 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  for (const m of game.missiles) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.atan2(m.vy, m.vx));
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(-10, -4, 20, 8);
    ctx.fillStyle = "#facc15";
    ctx.fillRect(6, -3, 6, 6);
    ctx.restore();
  }

  for (const p of game.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  const ax = game.aimWorldX;
  const ay = game.aimWorldY;
  ctx.save();
  ctx.strokeStyle = hero.traits.tremor ? "#ea580c" : "#dc2626";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(ax, ay, 11, 0, Math.PI * 2);
  ctx.moveTo(ax - 16, ay); ctx.lineTo(ax - 6, ay);
  ctx.moveTo(ax + 6, ay);  ctx.lineTo(ax + 16, ay);
  ctx.moveTo(ax, ay - 16); ctx.lineTo(ax, ay - 6);
  ctx.moveTo(ax, ay + 6);  ctx.lineTo(ax, ay + 16);
  ctx.stroke();
  ctx.restore();
}

function drawBlindSightMask() {
  if (!hero.traits.blind || game.debug) return;

  const sx = hero.x + hero.w / 2 - game.camX;
  const sy = hero.y + hero.h * 0.45 - game.camY;
  const sightRadius = hero.stats?.sightRadius ?? 155;

  sightCtx.globalCompositeOperation = "source-over";
  sightCtx.clearRect(0, 0, W, H);
  sightCtx.fillStyle = "rgba(12, 16, 28, 0.94)";
  sightCtx.fillRect(0, 0, W, H);

  sightCtx.globalCompositeOperation = "destination-out";
  const grad = sightCtx.createRadialGradient(sx, sy, sightRadius * 0.62, sx, sy, sightRadius);
  grad.addColorStop(0, "rgba(0, 0, 0, 1)");
  grad.addColorStop(1, "rgba(0, 0, 0, 0)");
  sightCtx.fillStyle = grad;
  sightCtx.beginPath();
  sightCtx.arc(sx, sy, sightRadius, 0, Math.PI * 2);
  sightCtx.fill();

  ctx.drawImage(sightCanvas, 0, 0);
}

function drawHUD() {
  ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
  ctx.fillRect(0, 0, W, 26);

  ctx.fillStyle = "#facc15";
  ctx.font = "bold 13px sans-serif";
  ctx.fillText(`${hero.identity.zhName} ${hero.identity.enName} (${hero.identity.anchors})`, 10, 17);

  ctx.font = "bold 13px monospace";
  ctx.fillStyle = "#ef4444";
  ctx.fillText(`HP:`, 255, 17);
  ctx.fillStyle = "#334155";
  ctx.fillRect(280, 7, 80, 12);
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(280, 7, Math.max(0, hero.hp * 0.8), 12);

  ctx.fillStyle = "#fef08a";
  ctx.fillText(`BONE:${hero.bones}/4`, 370, 17);

  if (!hero.hasMissileHat) {
    ctx.fillStyle = "#94a3b8";
    ctx.fillText(`HAT:--`, 452, 17);
  } else if (hero.hatCooldown <= 0) {
    ctx.fillStyle = "#facc15";
    ctx.fillText(`HAT:RDY`, 452, 17);
  } else {
    ctx.fillStyle = "#fb923c";
    ctx.fillText(`HAT:${hero.hatCooldown.toFixed(1)}`, 452, 17);
  }

  const totalScreens = stageManager.data.screens.length;
  ctx.fillStyle = "#38bdf8";
  ctx.fillText(`BG:${game.screenIdx + 1}/${totalScreens}`, 528, 17);

  const mins = Math.floor(game.stageTimer / 60);
  const secs = Math.floor(game.stageTimer % 60).toString().padStart(2, "0");
  ctx.fillStyle = game.stageTimer < 60 ? "#f87171" : "#f8fafc";
  ctx.fillText(`${mins}:${secs}`, 602, 17);

  ctx.fillStyle = "#f8fafc";
  ctx.fillText(`${game.score.toString().padStart(6, "0")}`, 654, 17);

  ctx.fillStyle = "#cbd5e1";
  ctx.fillText(`[TAB]CHAR [M]BGM [F2]DBG`, 725, 17);

  if (game.debug && game.activeScreen) {
    const scr = game.activeScreen;
    ctx.save();
    ctx.translate(-Math.round(game.camX), -Math.round(game.camY));

    ctx.strokeStyle = "rgba(37, 99, 235, 0.45)";
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(hero.x + hero.w / 2, hero.y + hero.h * 0.45, HALF_W * hero.stats.bulletDropRatio, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = "#22c55e";
    for (const s of scr.solids) ctx.strokeRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = "#eab308";
    for (const l of scr.ladders) ctx.strokeRect(l.x, l.y, l.w, l.h);
    ctx.strokeStyle = "#10b981";
    if (scr.exit) ctx.strokeRect(scr.exit.x, scr.exit.y, scr.exit.w, scr.exit.h);
    ctx.strokeStyle = "#ef4444";
    ctx.strokeRect(hero.x, hero.y, hero.w, hero.h);

    if (debugDrag.active) {
      const rx = Math.min(debugDrag.startX, debugDrag.curX);
      const ry = Math.min(debugDrag.startY, debugDrag.curY);
      const rw = Math.abs(debugDrag.curX - debugDrag.startX);
      const rh = Math.abs(debugDrag.curY - debugDrag.startY);
      ctx.strokeStyle = "#c026d3";
      ctx.lineWidth = 2;
      ctx.strokeRect(rx, ry, rw, rh);
    }
    ctx.restore();

    if (debugDrag.lastJson) {
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fillRect(10, H - 34, 480, 26);
      ctx.fillStyle = "#4ade80";
      ctx.font = "13px monospace";
      ctx.fillText(`DRAG BOX: ${debugDrag.lastJson}`, 18, H - 16);
    }
  }

  if (game.state === "GAMEOVER" || game.state === "VICTORY") {
    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = game.state === "VICTORY" ? "#facc15" : "#f87171";
    ctx.font = "bold 36px monospace";
    ctx.textAlign = "center";
    ctx.fillText(game.state === "VICTORY" ? "STAGE 001 TREASURE FOUND!" : "TIME / HP EXHAUSTED", W / 2, H / 2 - 40);
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 22px sans-serif";
    ctx.fillText(`${hero.identity.zhName} — ${hero.identity.enName} (${hero.identity.anchors}) [${setup.difficulty}]`, W / 2, H / 2 + 4);
    ctx.fillStyle = "#f8fafc";
    ctx.font = "17px monospace";
    ctx.fillText(`FINAL SCORE: ${game.score}  |  [R] RETRY  |  [TAB] CHANGE HUNTER`, W / 2, H / 2 + 46);
    ctx.textAlign = "left";
  }
}

function drawSelectScreen() {
  setup.uiBoxes.length = 0;
  drawActiveScreenBackground(STAGE_001_DEFAULT.screens[0]);

  ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
  ctx.fillRect(32, 20, W - 64, H - 40);
  ctx.strokeStyle = "#facc15";
  ctx.lineWidth = 2;
  ctx.strokeRect(32, 20, W - 64, H - 40);

  ctx.textAlign = "center";
  ctx.fillStyle = "#facc15";
  ctx.font = "bold 25px monospace";
  ctx.fillText("UNBOUND RELICS  無界尋寶錄", W / 2, 54);

  ctx.fillStyle = "#cbd5e1";
  ctx.font = "13px monospace";
  ctx.fillText("ASDW MOVE/JUMP/LADDER  |  MOUSE AIM + L-CLICK GUN  |  R-CLICK BONE  |  F HAT MISSILE", W / 2, 76);

  const diffBtns = [
    { id: "NORMAL",   label: "NORMAL (1) [N]",   x: W / 2 - 345, y: 92, w: 216, h: 36 },
    { id: "HARD",     label: "HARD (3) [H]",     x: W / 2 - 108, y: 92, w: 216, h: 36 },
    { id: "ULTIMATE", label: "ULTIMATE (5) [U]", x: W / 2 + 129, y: 92, w: 216, h: 36 }
  ];

  for (const b of diffBtns) {
    const active = setup.difficulty === b.id;
    ctx.fillStyle = active ? (b.id === "ULTIMATE" ? "#c026d3" : "#eab308") : "#1e293b";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = active ? "#fef08a" : "#64748b";
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    ctx.fillStyle = active ? (b.id === "ULTIMATE" ? "#ffffff" : "#0f172a") : "#f8fafc";
    ctx.font = "bold 14px monospace";
    ctx.fillText(b.label, b.x + b.w / 2, b.y + 23);

    setup.uiBoxes.push({
      x: b.x, y: b.y, w: b.w, h: b.h,
      onClick: () => setDifficulty(b.id)
    });
  }

  const cardW = 428;
  const cardH = 82;
  const startX = 52;
  const startY = 142;
  const gapX = 24;
  const gapY = 12;

  TRAIT_ORDER.forEach((traitId, idx) => {
    const t = traitsConfig.traits[traitId];
    if (!t) return;
    const col = idx % 2;
    const row = Math.floor(idx / 2);
    const cx = idx === 4 ? W / 2 - cardW / 2 : startX + col * (cardW + gapX);
    const cy = startY + row * (cardH + gapY);

    const isSelected = setup.selected.includes(traitId);

    ctx.fillStyle = isSelected ? "rgba(30, 58, 138, 0.92)" : "rgba(30, 41, 59, 0.9)";
    ctx.fillRect(cx, cy, cardW, cardH);
    ctx.strokeStyle = isSelected ? "#facc15" : "#475569";
    ctx.lineWidth = isSelected ? 2.5 : 1.5;
    ctx.strokeRect(cx, cy, cardW, cardH);

    ctx.textAlign = "left";
    ctx.fillStyle = isSelected ? "#facc15" : "#f8fafc";
    ctx.font = "bold 18px sans-serif";
    ctx.fillText(`${t.num}. ${t.en}  ${t.zhName} (${t.anchor})`, cx + 14, cy + 30);

    ctx.textAlign = "right";
    ctx.fillStyle = isSelected ? "#38bdf8" : "#64748b";
    ctx.font = "bold 13px monospace";
    ctx.fillText(isSelected ? "SELECTED" : `[KEY ${t.num}]`, cx + cardW - 14, cy + 28);

    ctx.textAlign = "left";
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "12px monospace";
    ctx.fillText(t.desc || "", cx + 14, cy + 58);

    setup.uiBoxes.push({
      x: cx, y: cy, w: cardW, h: cardH,
      onClick: () => toggleTraitSelection(traitId)
    });
  });

  const needed = requiredTraitCount();
  const ready = setup.selected.length === needed;
  const preview = buildHunterIdentity(setup.selected);

  ctx.fillStyle = "#0f172a";
  ctx.fillRect(52, 434, W - 104, 64);
  ctx.strokeStyle = ready ? "#22c55e" : "#64748b";
  ctx.lineWidth = 2;
  ctx.strokeRect(52, 434, W - 104, 64);

  ctx.textAlign = "center";
  ctx.fillStyle = "#94a3b8";
  ctx.font = "12px monospace";
  ctx.fillText(
    ready
      ? `TREASURE HUNTER PROFILE [${preview.code}]:`
      : `PICK ${needed - setup.selected.length} MORE TRAIT(S):`,
    W / 2,
    454
  );

  ctx.fillStyle = ready ? "#facc15" : "#64748b";
  ctx.font = "bold 23px sans-serif";
  ctx.fillText(
    ready ? `${preview.enName}   ${preview.zhName}  (${preview.anchors})` : preview.zhName,
    W / 2,
    484
  );

  const btnX = W / 2 - 175;
  const btnY = 514;
  const btnW = 350;
  const btnH = 48;
  ctx.fillStyle = ready ? "#16a34a" : "#334155";
  ctx.fillRect(btnX, btnY, btnW, btnH);
  ctx.strokeStyle = ready ? "#86efac" : "#475569";
  ctx.lineWidth = 2;
  ctx.strokeRect(btnX, btnY, btnW, btnH);

  ctx.fillStyle = ready ? "#ffffff" : "#94a3b8";
  ctx.font = "bold 17px monospace";
  ctx.fillText(ready ? "START STAGE 001 [ENTER]" : `SELECT ${needed} TRAIT(S)`, W / 2, btnY + 30);

  if (ready) {
    setup.uiBoxes.push({
      x: btnX, y: btnY, w: btnW, h: btnH,
      onClick: () => startStageWithSelectedTraits()
    });
  }

  ctx.textAlign = "left";
}

/* ============================================================================
 * 9. FIXED 60 FPS MAIN LOOP
 * ========================================================================== */
let lastTime = performance.now();
let accumulator = 0;

function updateTick() {
  if (game.state === "SELECT") return;
  if (game.shakeTimer > 0) game.shakeTimer = Math.max(0, game.shakeTimer - DT);

  if (game.state === "SCREEN_FADE") {
    game.fadeTimer -= DT;
    if (game.fadeTimer <= 0) game.state = "PLAY";
    return;
  }

  if (game.state !== "PLAY" || !game.activeScreen) return;

  game.elapsedTime += DT;
  game.stageTimer = Math.max(0, game.stageTimer - DT);
  if (game.stageTimer <= 0) {
    game.state = "GAMEOVER";
    SFX.syncBgm();
    return;
  }

  const input = getEffectiveInput();
  stepHero(input, game.activeScreen);
  stepProjectilesAndPickups(game.activeScreen);
  stepEnemies(game.activeScreen);
  stepParticles();
  updateCamera();
}

function renderFrame() {
  if (game.state === "SELECT") {
    drawSelectScreen();
    return;
  }

  const scr = game.activeScreen;
  if (!scr) return;

  ctx.save();
  if (game.shakeTimer > 0) {
    ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  }

  ctx.save();
  ctx.translate(-Math.round(game.camX), -Math.round(game.camY));

  drawActiveScreenBackground(scr);
  drawScreenEntities(scr);
  drawHero();
  drawProjectilesAndAimMark();

  ctx.restore();
  drawBlindSightMask();
  ctx.restore();

  if (game.state === "SCREEN_FADE") {
    ctx.fillStyle = `rgba(15, 23, 42, ${Math.min(1, game.fadeTimer / 0.28)})`;
    ctx.fillRect(0, 0, W, H);
  }

  drawHUD();
}

function loop(now) {
  const elapsed = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  accumulator += elapsed;

  while (accumulator >= DT) {
    updateTick();
    accumulator -= DT;
  }

  renderFrame();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
