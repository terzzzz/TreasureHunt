<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Unbound Seekers — 無界尋寶錄</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      background: #18181b;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", Courier, monospace;
      touch-action: none;
    }
    #stage-wrap {
      position: relative;
      width: 100vw;
      height: 100dvh;
      padding: max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas#game {
      display: block;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
      background: #f5f1e6;
      cursor: crosshair;
    }
    /* Allow iOS/Android text input & touch scrolling inside the scoreboard modal */
    #ub-sb-overlay, #ub-sb-overlay * {
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
    }
    #ub-sb-scroll {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="game" width="984" height="621"></canvas>
  </div>

  <script src="js/config.js"></script>
  <script>
    (function fitGameViewport() {
      const targetRatio = (typeof DISPLAY_ASPECT_RATIO !== "undefined") ? DISPLAY_ASPECT_RATIO : (4 / 3);

      function apply() {
        const vv = window.visualViewport;
        const vw = Math.floor(vv ? vv.width : window.innerWidth);
        const vh = Math.floor(vv ? vv.height : window.innerHeight);

        document.documentElement.style.width = vw + "px";
        document.documentElement.style.height = vh + "px";
        document.body.style.width = vw + "px";
        document.body.style.height = vh + "px";

        const wrap = document.getElementById("stage-wrap");
        const canvas = document.getElementById("game");
        if (!wrap || !canvas) return;

        wrap.style.width = vw + "px";
        wrap.style.height = vh + "px";

        const cs = getComputedStyle(wrap);
        const availW = Math.max(120, vw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
        const availH = Math.max(120, vh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));

        let drawW = availW;
        let drawH = drawW / targetRatio;
        if (drawH > availH) {
          drawH = availH;
          drawW = drawH * targetRatio;
        }

        canvas.style.width = Math.floor(drawW) + "px";
        canvas.style.height = Math.floor(drawH) + "px";

        if (window.scrollY !== 0 || window.scrollX !== 0) {
          window.scrollTo(0, 0);
        }
      }

      apply();
      window.addEventListener("resize", apply);
      window.addEventListener("load", apply);
      window.addEventListener("orientationchange", () => setTimeout(apply, 160));
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", apply);
        window.visualViewport.addEventListener("scroll", apply);
      }
    })();
  </script>
  <script src="js/scoreboard.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/procgen.js"></script>
  <script src="js/input.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
