<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Unbound Relics — 無界尋寶錄</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #18181b;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", Courier, monospace;
      touch-action: none;
    }
    #stage-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#game {
      display: block;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 328 / 207;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
      background: #f5f1e6;
      cursor: crosshair;
    }
    #touch-ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 20;
    }
    #touch-ui.active { display: block; }
    .touch-stick-base {
      position: absolute;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: rgba(25, 35, 55, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.35);
      pointer-events: auto;
    }
    .touch-stick-knob {
      position: absolute;
      left: 42px;
      top: 42px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      border: 2px solid rgba(25, 35, 55, 0.6);
      pointer-events: none;
    }
    .touch-buttons {
      position: absolute;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 190px;
      height: 150px;
      pointer-events: none;
    }
    .t-btn {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      background: rgba(25, 35, 55, 0.35);
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: auto;
    }
    .t-btn.pressed {
      background: rgba(235, 165, 40, 0.65);
      transform: scale(0.94);
    }
    #btn-jump { right: 64px; bottom: 0; }
    #btn-gun  { right: 0;    bottom: 44px; }
    #btn-bone { right: 128px; bottom: 44px; }
    #btn-hat  { right: 64px; bottom: 88px; }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="game" width="984" height="621"></canvas>
  </div>

  <div id="touch-ui">
    <div class="touch-stick-base" id="stick-base">
      <div class="touch-stick-knob" id="stick-knob"></div>
    </div>
    <div class="touch-buttons">
      <div class="t-btn" id="btn-jump">JUMP</div>
      <div class="t-btn" id="btn-gun">GUN</div>
      <div class="t-btn" id="btn-bone">BONE</div>
      <div class="t-btn" id="btn-hat">HAT</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/input.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
