<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>The Blind Treasure</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #18181b;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", Courier, monospace;
      touch-action: none;
    }
    #stage-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#game {
      display: block;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 328 / 207;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
      background: #f5eedc;
    }
    /* Responsive Touch Controls (Auto-shown on touch, hidden on keyboard) */
    #touch-ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 20;
    }
    #touch-ui.active {
      display: block;
    }
    .touch-stick-base {
      position: absolute;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: rgba(25, 35, 55, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.35);
      pointer-events: auto;
    }
    .touch-stick-knob {
      position: absolute;
      left: 42px;
      top: 42px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      border: 2px solid rgba(25, 35, 55, 0.6);
      pointer-events: none;
    }
    .touch-buttons {
      position: absolute;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 190px;
      height: 150px;
      pointer-events: none;
    }
    .t-btn {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      background: rgba(25, 35, 55, 0.35);
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: auto;
    }
    .t-btn.pressed {
      background: rgba(235, 165, 40, 0.65);
      transform: scale(0.94);
    }
    #btn-jump { right: 64px; bottom: 0; }
    #btn-gun  { right: 0;    bottom: 44px; }
    #btn-bone { right: 128px; bottom: 44px; }
    #btn-hat  { right: 64px; bottom: 88px; }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="game" width="984" height="621"></canvas>
  </div>

  <div id="touch-ui">
    <div class="touch-stick-base" id="stick-base">
      <div class="touch-stick-knob" id="stick-knob"></div>
    </div>
    <div class="touch-buttons">
      <div class="t-btn" id="btn-jump">JUMP</div>
      <div class="t-btn" id="btn-gun">GUN</div>
      <div class="t-btn" id="btn-bone">BONE</div>
      <div class="t-btn" id="btn-hat">HAT</div>
    </div>
  </div>

<script>
"use strict";

/* ============================================================================
 * 1. CANVAS & 楷簿 (328mm x 207mm -> 984 x 621 px at 3 px/mm)
 * ========================================================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const SCALE = 3;
const W = 328 * SCALE;        // 984 px
const H = 207 * SCALE;        // 621 px
const HALF_W = W / 2;         // 492 px (1 page width = Machine Gun max range!)
const FPS = 60;
const DT = 1 / FPS;

/* ============================================================================
 * 2. OPTIONAL PNG ASSET LOADER (Relative paths for GitHub Pages & iOS)
 *    Drop PNGs into ./assets/ later; procedural ink art renders automatically
 *    whenever an image file is not yet present.
 * ========================================================================== */
const ASSET_PATHS = {
  bgRoom0: "./assets/bg_room0.png",
  bgRoom1: "./assets/bg_room1.png",
  hero:    "./assets/hero.png",
  giant:   "./assets/giant.png",
  giantRod:"./assets/giant_rod.png",
  monster: "./assets/monster.png",
  chicken: "./assets/chicken.png",
  bone:    "./assets/bone.png",
  hat:     "./assets/hat.png",
  missile: "./assets/missile.png",
  treasure:"./assets/treasure.png"
};

const ASSETS = {};
for (const [key, src] of Object.entries(ASSET_PATHS)) {
  const img = new Image();
  img.loaded = false;
  img.onload = () => { img.loaded = true; };
  img.onerror = () => { img.loaded = false; };
  img.src = src;
  ASSETS[key] = img;
}

/* ============================================================================
 * 3. RETRO WEB AUDIO SYNTH (Unlocked on first tap/keypress for iOS Safari)
 * ========================================================================== */
const SFX = {
  ctx: null,
  muted: false,
  unlock() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {});
    }
  },
  beep(freq, dur, type = "square", gainVal = 0.08, slideTo = null) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(gainVal, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
};

/* ============================================================================
 * 4. INPUT MANAGER (Keyboard + Auto-Showing Landscape Touch Controls)
 * ========================================================================== */
const keys = Object.create(null);
const justPressed = Object.create(null);
const touchState = { left: false, right: false, up: false, down: false, jump: false, gun: false, bone: false, hat: false };
const touchUI = document.getElementById("touch-ui");

window.addEventListener("keydown", e => {
  SFX.unlock();
  touchUI.classList.remove("active");
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;

  if (e.code === "F2") {
    e.preventDefault();
    game.debug = !game.debug;
  } else if (e.code === "KeyM") {
    SFX.muted = !SFX.muted;
  } else if (e.code === "KeyR" && (game.state === "GAMEOVER" || game.state === "VICTORY")) {
    resetEpisode();
  }
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});

function setupTouchControls() {
  const stickBase = document.getElementById("stick-base");
  const stickKnob = document.getElementById("stick-knob");
  let stickTouchId = null;

  window.addEventListener("touchstart", () => {
    SFX.unlock();
    touchUI.classList.add("active");
  }, { passive: true });

  stickBase.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    stickTouchId = t.identifier;
    updateStick(t.clientX, t.clientY);
  }, { passive: false });

  stickBase.addEventListener("touchmove", e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouchId) updateStick(t.clientX, t.clientY);
    }
  }, { passive: false });

  const endStick = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouchId) {
        stickTouchId = null;
        touchState.left = touchState.right = touchState.up = touchState.down = false;
        stickKnob.style.transform = "translate(0px, 0px)";
      }
    }
  };
  stickBase.addEventListener("touchend", endStick);
  stickBase.addEventListener("touchcancel", endStick);

  function updateStick(cx, cy) {
    const rect = stickBase.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    let dx = cx - centerX;
    let dy = cy - centerY;
    const maxR = 42;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    const dead = 14;
    touchState.left  = dx < -dead;
    touchState.right = dx > dead;
    touchState.up    = dy < -dead;
    touchState.down  = dy > dead;
  }

  function bindBtn(id, field, virtualKey) {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", e => {
      e.preventDefault();
      SFX.unlock();
      if (!touchState[field]) justPressed[virtualKey] = true;
      touchState[field] = true;
      el.classList.add("pressed");
    }, { passive: false });
    const release = e => {
      e.preventDefault();
      touchState[field] = false;
      el.classList.remove("pressed");
    };
    el.addEventListener("touchend", release);
    el.addEventListener("touchcancel", release);
  }

  bindBtn("btn-jump", "jump", "TOUCH_JUMP");
  bindBtn("btn-gun",  "gun",  "TOUCH_GUN");
  bindBtn("btn-bone", "bone", "TOUCH_BONE");
  bindBtn("btn-hat",  "hat",  "TOUCH_HAT");
}
setupTouchControls();

function readInput() {
  const left  = !!(keys["ArrowLeft"]  || keys["KeyA"] || touchState.left);
  const right = !!(keys["ArrowRight"] || keys["KeyD"] || touchState.right);
  const up    = !!(keys["ArrowUp"]    || keys["KeyW"] || touchState.up);
  const down  = !!(keys["ArrowDown"]  || keys["KeyS"] || touchState.down);

  const jumpHeld    = !!(keys["Space"] || keys["KeyZ"] || keys["KeyK"] || touchState.jump);
  const jumpPressed = !!(justPressed["Space"] || justPressed["KeyZ"] || justPressed["KeyK"] || justPressed["TOUCH_JUMP"]);
  const gunHeld     = !!(keys["KeyJ"] || keys["KeyX"] || keys["Enter"] || touchState.gun);
  const bonePressed = !!(justPressed["KeyU"] || justPressed["KeyC"] || justPressed["TOUCH_BONE"]);
  const hatPressed  = !!(justPressed["KeyI"] || justPressed["KeyV"] || keys["ShiftLeft"] || keys["ShiftRight"] || justPressed["TOUCH_HAT"]);

  return { left, right, up, down, jumpHeld, jumpPressed, gunHeld, bonePressed, hatPressed };
}

/* ============================================================================
 * 5. EPISODE ROOM DEFINITIONS (Spread 01 & Spread 02)
 *    All coordinates match the 984 x 621 opened 楷簿 spread.
 * ========================================================================== */
function createRooms() {
  return [
    {
      id: 0,
      pageLeft: "01",
      pageRight: "02",
      bgAsset: "bgRoom0",
      // Solid impassable blocks (floors & walls)
      solids: [
        { x: 0,   y: 564, w: 462, h: 57 }, // Left page ground
        { x: 522, y: 564, w: 462, h: 57 }, // Right page ground (gap at spine!)
        { x: 0,   y: 0,   w: 28,  h: 564 }, // Far left outer wall
        { x: 558, y: 396, w: 180, h: 20 }, // Right page stone block
        { x: 956, y: 0,   w: 28,  h: 420 }  // Upper right wall (open exit below to Room 1!)
      ],
      // One-way platforms (can jump up through, or Down+Jump to drop through)
      oneWay: [
        { x: 102, y: 432, w: 180, h: 12 },
        { x: 282, y: 300, w: 180, h: 12 },
        { x: 558, y: 264, w: 252, h: 12 }
      ],
      // Climbable ladders
      ladders: [
        { x: 222, y: 432, w: 36, h: 132 },
        { x: 318, y: 300, w: 36, h: 132 },
        { x: 750, y: 264, w: 36, h: 300 }
      ],
      pickups: [
        { type: "chicken", x: 130, y: 398, w: 28, h: 24, collected: false },
        { type: "hat",     x: 610, y: 226, w: 30, h: 24, collected: false },
        { type: "gem",     x: 360, y: 268, w: 22, h: 22, collected: false }
      ],
      enemies: [
        {
          kind: "crawler", x: 320, y: 524, w: 32, h: 40,
          vx: -75, vy: 0, minX: 140, maxX: 430, facing: -1,
          hp: 30, maxHp: 30, animTimer: 0, hurtTimer: 0, alive: true
        },
        {
          kind: "giant", x: 790, y: 472, w: 54, h: 92,
          vx: -55, vy: 0, minX: 745, maxX: 930, facing: -1,
          hp: 140, maxHp: 140, animTimer: 0, hurtTimer: 0, alive: true,
          aiState: "WALK", aiTimer: 0, rodAngle: -0.4, rodLength: 74, struckThisSwing: false
        }
      ],
      exits: { right: 1 }
    },
    {
      id: 1,
      pageLeft: "03",
      pageRight: "04",
      bgAsset: "bgRoom1",
      solids: [
        { x: 0,   y: 564, w: 984, h: 57 }, // Full spread ground
        { x: 956, y: 0,   w: 28,  h: 564 }, // Far right outer wall
        { x: 252, y: 420, w: 144, h: 20 },
        { x: 594, y: 420, w: 144, h: 20 }
      ],
      oneWay: [
        { x: 108, y: 288, w: 216, h: 12 },
        { x: 660, y: 288, w: 216, h: 12 },
        { x: 396, y: 192, w: 192, h: 12 }
      ],
      ladders: [
        { x: 144, y: 288, w: 36, h: 276 },
        { x: 804, y: 288, w: 36, h: 276 },
        { x: 474, y: 192, w: 36, h: 228 }
      ],
      pickups: [
        { type: "chicken",  x: 150, y: 254, w: 28, h: 24, collected: false },
        { type: "treasure", x: 472, y: 148, w: 40, h: 34, collected: false }
      ],
      enemies: [
        {
          kind: "giant", x: 440, y: 472, w: 54, h: 92,
          vx: 65, vy: 0, minX: 220, maxX: 740, facing: 1,
          hp: 160, maxHp: 160, animTimer: 0, hurtTimer: 0, alive: true,
          aiState: "WALK", aiTimer: 0, rodAngle: -0.4, rodLength: 74, struckThisSwing: false
        },
        {
          kind: "crawler", x: 690, y: 248, w: 32, h: 40,
          vx: 80, vy: 0, minX: 665, maxX: 850, facing: 1,
          hp: 35, maxHp: 35, animTimer: 0, hurtTimer: 0, alive: true
        }
      ],
      exits: { left: 0 }
    }
  ];
}

/* ============================================================================
 * 6. GAME STATE & HERO INITIALIZATION
 * ========================================================================== */
const game = {
  state: "PLAY", // PLAY | TRANSITION | GAMEOVER | VICTORY
  debug: false,
  rooms: createRooms(),
  roomIdx: 0,
  stageTimer: 600, // 10 minutes (600 seconds) per episode
  score: 0,
  shakeTimer: 0,
  transition: {
    active: false,
    fromIdx: 0,
    toIdx: 1,
    dirX: 1,
    t: 0,
    duration: 0.32,
    nextHeroX: 40,
    nextHeroY: 500
  },
  bullets: [],
  bones: [],
  missiles: [],
  particles: []
};

const hero = {
  x: 64,
  y: 510,
  w: 26,
  h: 44,
  vx: 0,
  vy: 0,
  facing: 1,       // 1 = right, -1 = left
  aimAngle: 0,     // 5 directions: -PI/2, -PI/4, 0, PI/4, PI/2 (mirrored by facing)
  grounded: false,
  onLadder: false,
  dropThroughTimer: 0,
  hp: 100,
  maxHp: 100,
  invulnTimer: 0,
  gunCooldown: 0,
  bones: 0,        // Gained in batches of 4 when eating a roast chicken
  hasMissileHat: false,
  hatCooldown: 0,
  hatMaxCooldown: 4.5,
  animState: "IDLE",
  animTimer: 0
};

function resetEpisode() {
  game.state = "PLAY";
  game.rooms = createRooms();
  game.roomIdx = 0;
  game.stageTimer = 600;
  game.score = 0;
  game.bullets.length = 0;
  game.bones.length = 0;
  game.missiles.length = 0;
  game.particles.length = 0;
  game.transition.active = false;

  Object.assign(hero, {
    x: 64, y: 510, vx: 0, vy: 0, facing: 1, aimAngle: 0,
    grounded: false, onLadder: false, dropThroughTimer: 0,
    hp: 100, invulnTimer: 0, gunCooldown: 0,
    bones: 0, hasMissileHat: false, hatCooldown: 0,
    animState: "IDLE", animTimer: 0
  });
}

/* ============================================================================
 * 7. PHYSICS, 5-DIRECTION AIMING, WEAPONS & AI STEP (60 FPS)
 * ========================================================================== */
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function resolveAimVector(input) {
  // 5-direction aiming: Up, Up+Forward, Forward, Down+Forward, Down
  const horiz = input.left || input.right;
  let vx = hero.facing;
  let vy = 0;

  if (input.up && horiz) {
    vx = hero.facing * Math.SQRT1_2;
    vy = -Math.SQRT1_2;
  } else if (input.up && !horiz) {
    vx = 0;
    vy = -1;
  } else if (input.down && horiz) {
    vx = hero.facing * Math.SQRT1_2;
    vy = Math.SQRT1_2;
  } else if (input.down && !horiz && (!hero.grounded || hero.onLadder)) {
    vx = 0;
    vy = 1;
  } else {
    vx = hero.facing;
    vy = 0;
  }

  hero.aimAngle = Math.atan2(vy, vx);
  return { vx, vy };
}

function spawnParticles(x, y, color, count = 8, speed = 160) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (0.3 + Math.random() * 0.7) * speed;
    game.particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 40,
      life: 0.25 + Math.random() * 0.25,
      maxLife: 0.5,
      color,
      size: 3 + Math.random() * 3
    });
  }
}

function damageHero(amount, knockDir) {
  if (hero.invulnTimer > 0 || game.state !== "PLAY") return;
  hero.hp = Math.max(0, hero.hp - amount);
  hero.invulnTimer = 1.0;
  hero.onLadder = false;
  hero.vx = knockDir * 220;
  hero.vy = -260;
  game.shakeTimer = 0.2;
  spawnParticles(hero.x + hero.w / 2, hero.y + hero.h / 2, "#d93838", 12, 180);
  SFX.beep(140, 0.25, "sawtooth", 0.12, 60);

  if (hero.hp <= 0) {
    game.state = "GAMEOVER";
  }
}

function stepHero(input, room) {
  const GRAVITY = 1380;
  const WALK_SPEED = 205;
  const CLIMB_SPEED = 140;
  const JUMP_VEL = -490;

  if (hero.invulnTimer > 0) hero.invulnTimer = Math.max(0, hero.invulnTimer - DT);
  if (hero.gunCooldown > 0) hero.gunCooldown = Math.max(0, hero.gunCooldown - DT);
  if (hero.hatCooldown > 0) hero.hatCooldown = Math.max(0, hero.hatCooldown - DT);
  if (hero.dropThroughTimer > 0) hero.dropThroughTimer = Math.max(0, hero.dropThroughTimer - DT);

  // Check ladder overlap
  const heroCenter = { x: hero.x + 6, y: hero.y + 4, w: hero.w - 12, h: hero.h };
  const ladder = room.ladders.find(l => rectsOverlap(heroCenter, l));

  if (ladder && (input.up || input.down)) {
    hero.onLadder = true;
    hero.grounded = false;
    hero.vx = 0;
    hero.vy = input.up ? -CLIMB_SPEED : CLIMB_SPEED;
    const targetX = ladder.x + (ladder.w - hero.w) / 2;
    hero.x += (targetX - hero.x) * 0.35;
  } else if (!ladder) {
    hero.onLadder = false;
  }

  // Horizontal movement & facing
  if (input.left && !input.right) hero.facing = -1;
  if (input.right && !input.left) hero.facing = 1;

  if (!hero.onLadder) {
    const moveDir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (hero.invulnTimer < 0.75) {
      hero.vx = moveDir * WALK_SPEED;
    }
    hero.vy = Math.min(hero.vy + GRAVITY * DT, 760);
  } else if (!input.up && !input.down) {
    hero.vy = 0;
    const moveDir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    hero.vx = moveDir * WALK_SPEED * 0.75;
  }

  // Drop through one-way platform if Down + Jump
  if (input.jumpPressed && input.down && hero.grounded && !hero.onLadder) {
    hero.dropThroughTimer = 0.18;
    hero.grounded = false;
    hero.y += 4;
  } else if (input.jumpPressed && (hero.grounded || hero.onLadder)) {
    hero.onLadder = false;
    hero.grounded = false;
    hero.vy = JUMP_VEL;
    SFX.beep(320, 0.11, "square", 0.06, 540);
  }

  // Move X & resolve solid walls
  hero.x += hero.vx * DT;
  for (const s of room.solids) {
    if (rectsOverlap(hero, s)) {
      if (hero.vx > 0) hero.x = s.x - hero.w;
      else if (hero.vx < 0) hero.x = s.x + s.w;
      hero.vx = 0;
    }
  }

  // Move Y & resolve solid floors/ceilings + one-way ledges
  const prevBottom = hero.y + hero.h;
  hero.y += hero.vy * DT;
  hero.grounded = false;

  for (const s of room.solids) {
    if (rectsOverlap(hero, s)) {
      if (hero.vy > 0) {
        hero.y = s.y - hero.h;
        hero.vy = 0;
        hero.grounded = true;
      } else if (hero.vy < 0) {
        hero.y = s.y + s.h;
        hero.vy = 0;
      }
    }
  }

  if (!hero.onLadder && hero.vy >= 0 && hero.dropThroughTimer <= 0) {
    for (const p of room.oneWay) {
      if (
        hero.x + hero.w > p.x &&
        hero.x < p.x + p.w &&
        prevBottom <= p.y + 6 &&
        hero.y + hero.h >= p.y
      ) {
        hero.y = p.y - hero.h;
        hero.vy = 0;
        hero.grounded = true;
      }
    }
  }

  // Pit fall check (e.g. falling into the center spine gap!)
  if (hero.y > H + 20) {
    damageHero(35, -hero.facing);
    hero.x = 80;
    hero.y = 480;
    hero.vx = 0;
    hero.vy = 0;
  }

  // Flip-screen edge transitions
  const cx = hero.x + hero.w / 2;
  if (cx > W && room.exits.right !== undefined) {
    startRoomTransition(room.exits.right, 1, 24, hero.y);
    return;
  } else if (cx < 0 && room.exits.left !== undefined) {
    startRoomTransition(room.exits.left, -1, W - hero.w - 24, hero.y);
    return;
  }
  hero.x = Math.max(0, Math.min(W - hero.w, hero.x));

  // Animation state
  if (hero.onLadder) {
    hero.animState = "CLIMB";
    if (Math.abs(hero.vy) > 1) hero.animTimer += DT * 9;
  } else if (!hero.grounded) {
    hero.animState = "JUMP";
  } else if (Math.abs(hero.vx) > 5) {
    hero.animState = "RUN";
    hero.animTimer += DT * 12;
  } else {
    hero.animState = "IDLE";
    hero.animTimer = 0;
  }

  // 5-angle aim & weapons
  const aim = resolveAimVector(input);
  const muzzleX = hero.x + hero.w / 2 + aim.vx * 16;
  const muzzleY = hero.y + hero.h * 0.45 + aim.vy * 16;

  // 1) Machine Gun (Default, unlimited ammo, strictly HALF SCREEN range = HALF_W)
  if (input.gunHeld && hero.gunCooldown <= 0) {
    hero.gunCooldown = 0.11;
    const bulletSpeed = 640;
    game.bullets.push({
      x: muzzleX,
      y: muzzleY,
      vx: aim.vx * bulletSpeed,
      vy: aim.vy * bulletSpeed,
      traveled: 0,
      maxRange: HALF_W, // 492 px = half the screen width!
      damage: 10
    });
    SFX.beep(780, 0.045, "square", 0.05, 320);
  }

  // 2) Chicken Bone Throw (4 per chicken eaten, infinite range until wall/enemy)
  if (input.bonePressed && hero.bones > 0) {
    hero.bones--;
    const throwSpeed = 420;
    game.bones.push({
      x: muzzleX,
      y: muzzleY - 4,
      vx: aim.vx * throwSpeed + hero.vx * 0.2,
      vy: aim.vy * throwSpeed - 190,
      rot: 0,
      damage: 55
    });
    SFX.beep(440, 0.12, "triangle", 0.09, 680);
  }

  // 3) Mini-Missile Hat (Unlimited ammo with cooldown once collected)
  if (input.hatPressed && hero.hasMissileHat && hero.hatCooldown <= 0) {
    hero.hatCooldown = hero.hatMaxCooldown;
    game.missiles.push({
      x: hero.x + hero.w / 2,
      y: hero.y - 4,
      vx: aim.vx * 520,
      vy: aim.vy * 520 - 80,
      targetVx: aim.vx * 560,
      targetVy: aim.vy * 560,
      timer: 0,
      damage: 110,
      splashRadius: 72
    });
    SFX.beep(260, 0.22, "sawtooth", 0.1, 720);
  }
}

function startRoomTransition(toIdx, dirX, nextHeroX, nextHeroY) {
  game.state = "TRANSITION";
  game.transition = {
    active: true,
    fromIdx: game.roomIdx,
    toIdx,
    dirX,
    t: 0,
    duration: 0.32,
    nextHeroX,
    nextHeroY
  };
  game.bullets.length = 0;
  game.bones.length = 0;
  game.missiles.length = 0;
}

function stepProjectilesAndPickups(room) {
  // Pickups
  for (const p of room.pickups) {
    if (p.collected) continue;
    if (rectsOverlap(hero, p)) {
      p.collected = true;
      if (p.type === "chicken") {
        hero.hp = Math.min(hero.maxHp, hero.hp + 45);
        hero.bones = 4; // Eating 1 chicken grants 4 throwable bones!
        game.score += 200;
        spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#e08a2e", 10, 140);
        SFX.beep(520, 0.18, "triangle", 0.1, 880);
      } else if (p.type === "hat") {
        hero.hasMissileHat = true;
        hero.hatCooldown = 0;
        game.score += 500;
        spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#f5c518", 14, 160);
        SFX.beep(440, 0.25, "square", 0.1, 990);
      } else if (p.type === "gem") {
        game.score += 300;
        spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#29b6f6", 10, 140);
        SFX.beep(660, 0.14, "sine", 0.1, 1040);
      } else if (p.type === "treasure") {
        game.score += 2000 + Math.floor(game.stageTimer) * 5;
        spawnParticles(p.x + p.w / 2, p.y + p.h / 2, "#ffd700", 24, 220);
        SFX.beep(523, 0.4, "square", 0.12, 1046);
        game.state = "VICTORY";
      }
    }
  }

  // 1) Machine Gun Bullets (Limited to HALF_W range!)
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    const stepX = b.vx * DT;
    const stepY = b.vy * DT;
    b.x += stepX;
    b.y += stepY;
    b.traveled += Math.hypot(stepX, stepY);

    // Dissipate at half-screen distance
    if (b.traveled >= b.maxRange) {
      spawnParticles(b.x, b.y, "#64748b", 3, 60);
      game.bullets.splice(i, 1);
      continue;
    }

    // Wall/Floor hit
    const hitSolid = room.solids.some(s => b.x >= s.x && b.x <= s.x + s.w && b.y >= s.y && b.y <= s.y + s.h);
    if (hitSolid) {
      spawnParticles(b.x, b.y, "#1e3a8a", 4, 80);
      game.bullets.splice(i, 1);
      continue;
    }

    // Enemy hit
    let hitEnemy = false;
    for (const e of room.enemies) {
      if (!e.alive) continue;
      if (b.x >= e.x && b.x <= e.x + e.w && b.y >= e.y && b.y <= e.y + e.h) {
        damageEnemy(e, b.damage, b.x, b.y);
        hitEnemy = true;
        break;
      }
    }
    if (hitEnemy) game.bullets.splice(i, 1);
  }

  // 2) Thrown Chicken Bones (Infinite range until hitting a wall/floor or enemy!)
  for (let i = game.bones.length - 1; i >= 0; i--) {
    const bone = game.bones[i];
    bone.vy += 860 * DT;
    bone.x += bone.vx * DT;
    bone.y += bone.vy * DT;
    bone.rot += 15 * DT;

    // Only despawn if it drops well below the page or hits a solid wall/floor or enemy
    if (bone.y > H + 80) {
      game.bones.splice(i, 1);
      continue;
    }

    const hitSolid = room.solids.some(s => bone.x >= s.x && bone.x <= s.x + s.w && bone.y >= s.y && bone.y <= s.y + s.h);
    if (hitSolid) {
      spawnParticles(bone.x, bone.y, "#f8fafc", 8, 130);
      SFX.beep(220, 0.08, "triangle", 0.07, 120);
      game.bones.splice(i, 1);
      continue;
    }

    let hitEnemy = false;
    for (const e of room.enemies) {
      if (!e.alive) continue;
      if (bone.x >= e.x - 6 && bone.x <= e.x + e.w + 6 && bone.y >= e.y - 6 && bone.y <= e.y + e.h + 6) {
        damageEnemy(e, bone.damage, bone.x, bone.y);
        spawnParticles(bone.x, bone.y, "#fef08a", 12, 170);
        hitEnemy = true;
        break;
      }
    }
    if (hitEnemy) game.bones.splice(i, 1);
  }

  // 3) Hat Mini-Missiles (High splash damage)
  for (let i = game.missiles.length - 1; i >= 0; i--) {
    const m = game.missiles[i];
    m.timer += DT;
    if (m.timer > 0.12) {
      m.vx += (m.targetVx - m.vx) * 0.25;
      m.vy += (m.targetVy - m.vy) * 0.25;
    }
    m.x += m.vx * DT;
    m.y += m.vy * DT;

    if (m.timer % 0.03 < DT) {
      spawnParticles(m.x, m.y, "#fb923c", 2, 40);
    }

    const outOfBounds = m.x < -30 || m.x > W + 30 || m.y < -30 || m.y > H + 30;
    const hitSolid = room.solids.some(s => m.x >= s.x && m.x <= s.x + s.w && m.y >= s.y && m.y <= s.y + s.h);
    const hitEnemy = room.enemies.some(e => e.alive && m.x >= e.x && m.x <= e.x + e.w && m.y >= e.y && m.y <= e.y + e.h);

    if (outOfBounds || hitSolid || hitEnemy) {
      // Splash explosion
      game.shakeTimer = 0.22;
      spawnParticles(m.x, m.y, "#ef4444", 18, 230);
      SFX.beep(110, 0.26, "sawtooth", 0.14, 42);
      for (const e of room.enemies) {
        if (!e.alive) continue;
        const dist = Math.hypot(e.x + e.w / 2 - m.x, e.y + e.h / 2 - m.y);
        if (dist <= m.splashRadius + e.w * 0.5) {
          damageEnemy(e, m.damage, m.x, m.y);
        }
      }
      game.missiles.splice(i, 1);
    }
  }
}

function damageEnemy(enemy, dmg, hitX, hitY) {
  enemy.hp -= dmg;
  enemy.hurtTimer = 0.14;
  spawnParticles(hitX, hitY, "#dc2626", 6, 120);
  SFX.beep(190, 0.07, "square", 0.07, 110);

  if (enemy.hp <= 0) {
    enemy.alive = false;
    game.score += enemy.kind === "giant" ? 800 : 250;
    spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, "#1e293b", 16, 200);
    SFX.beep(150, 0.22, "sawtooth", 0.1, 55);
  }
}

function stepEnemies(room) {
  for (const e of room.enemies) {
    if (!e.alive) continue;
    if (e.hurtTimer > 0) e.hurtTimer = Math.max(0, e.hurtTimer - DT);

    if (e.kind === "crawler") {
      e.animTimer += DT;
      e.x += e.vx * DT;
      if (e.x <= e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); e.facing = 1; }
      if (e.x + e.w >= e.maxX) { e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); e.facing = -1; }
      if (rectsOverlap(hero, e)) {
        damageHero(15, hero.x < e.x ? -1 : 1);
      }
    } else if (e.kind === "giant") {
      const distToHero = Math.abs((hero.x + hero.w / 2) - (e.x + e.w / 2));
      const sameHeight = Math.abs((hero.y + hero.h) - (e.y + e.h)) < 75;

      if (e.aiState === "WALK") {
        e.animTimer += DT;
        e.x += e.vx * DT;
        e.rodAngle = -0.35 + Math.sin(Math.floor(e.animTimer * 8)) * 0.12;
        if (e.x <= e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); e.facing = 1; }
        if (e.x + e.w >= e.maxX) { e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); e.facing = -1; }

        if (distToHero < 105 && sameHeight) {
          e.facing = hero.x < e.x ? -1 : 1;
          e.aiState = "WINDUP";
          e.aiTimer = 0.38;
        }
      } else if (e.aiState === "WINDUP") {
        e.aiTimer -= DT;
        e.rodAngle = -1.35; // Raised ruler/rod behind head
        if (e.aiTimer <= 0) {
          e.aiState = "STRIKE";
          e.aiTimer = 0.16;
          e.struckThisSwing = false;
          SFX.beep(130, 0.14, "sawtooth", 0.09, 70);
        }
      } else if (e.aiState === "STRIKE") {
        e.aiTimer -= DT;
        e.rodAngle = 1.45; // Slams rod forward
        if (!e.struckThisSwing) {
          const rodBox = {
            x: e.facing === 1 ? e.x + e.w * 0.5 : e.x + e.w * 0.5 - e.rodLength,
            y: e.y + e.h * 0.25,
            w: e.rodLength,
            h: e.h * 0.72
          };
          if (rectsOverlap(hero, rodBox)) {
            e.struckThisSwing = true;
            damageHero(28, e.facing);
          }
        }
        if (e.aiTimer <= 0) {
          e.aiState = "RECOVER";
          e.aiTimer = 0.45;
        }
      } else if (e.aiState === "RECOVER") {
        e.aiTimer -= DT;
        e.rodAngle = 0.9;
        if (e.aiTimer <= 0) {
          e.aiState = "WALK";
        }
      }

      if (rectsOverlap(hero, e)) {
        damageHero(18, hero.x < e.x ? -1 : 1);
      }
    }
  }
}

function stepParticles() {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= DT;
    p.vy += 420 * DT;
    p.x += p.vx * DT;
    p.y += p.vy * DT;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

/* ============================================================================
 * 8. RENDERER: OPENED 楷簿 (328x207mm), INK TERRAIN, BLIND HERO & GIANT
 * ========================================================================== */
function drawKaaiBouSpread(room, offsetX) {
  ctx.save();
  ctx.translate(offsetX, 0);

  // If user added a custom AI background image for this room, draw it first
  const customBg = ASSETS[room.bgAsset];
  if (customBg && customBg.loaded) {
    ctx.drawImage(customBg, 0, 0, W, H);
    ctx.restore();
    return;
  }

  // Procedural HK Traditional Exercise Book (楷簿) Paper
  const paperGrad = ctx.createLinearGradient(0, 0, W, 0);
  paperGrad.addColorStop(0.00, "#f3ebd6");
  paperGrad.addColorStop(0.47, "#faf5e8");
  paperGrad.addColorStop(0.50, "#dcd1b8"); // Center book crease shadow
  paperGrad.addColorStop(0.53, "#faf5e8");
  paperGrad.addColorStop(1.00, "#f3ebd6");
  ctx.fillStyle = paperGrad;
  ctx.fillRect(0, 0, W, H);

  drawSinglePageGrid(0, room.pageLeft);
  drawSinglePageGrid(HALF_W, room.pageRight);

  // Center fold line + 2 metal staples
  ctx.strokeStyle = "rgba(85, 75, 60, 0.45)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(HALF_W, 0);
  ctx.lineTo(HALF_W, H);
  ctx.stroke();

  ctx.fillStyle = "#94a3b8";
  ctx.fillRect(HALF_W - 2, H * 0.25 - 12, 4, 24);
  ctx.fillRect(HALF_W - 2, H * 0.75 - 12, 4, 24);

  // Draw Impassable Solids (Blue Ballpoint Pen Ink Blocks)
  for (const s of room.solids) {
    ctx.fillStyle = "#1e3a8a";
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = "#0f172a";
    ctx.lineWidth = 2;
    ctx.strokeRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
    // Subtle cross-hatch ink lines
    ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
    ctx.beginPath();
    for (let hx = s.x + 8; hx < s.x + s.w - 4; hx += 14) {
      ctx.moveTo(hx, s.y + 3);
      ctx.lineTo(hx - 6, s.y + s.h - 3);
    }
    ctx.stroke();
  }

  // Draw One-Way Ledges (Red Teacher-Pen Double Rules)
  for (const p of room.oneWay) {
    ctx.fillStyle = "#b91c1c";
    ctx.fillRect(p.x, p.y, p.w, 5);
    ctx.fillRect(p.x, p.y + 8, p.w, 3);
  }

  // Draw Ladders (Pencil/Ink Rungs)
  for (const l of room.ladders) {
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(l.x + 4, l.y);
    ctx.lineTo(l.x + 4, l.y + l.h);
    ctx.moveTo(l.x + l.w - 4, l.y);
    ctx.lineTo(l.x + l.w - 4, l.y + l.h);
    for (let ry = l.y + 14; ry < l.y + l.h; ry += 22) {
      ctx.moveTo(l.x + 4, ry);
      ctx.lineTo(l.x + l.w - 4, ry);
    }
    ctx.stroke();
  }

  ctx.restore();
}

function drawSinglePageGrid(pageX, pageLabel) {
  const margin = 10 * SCALE;  // 30 px
  const headerH = 16 * SCALE; // 48 px
  const left = pageX + margin;
  const top = margin + headerH;
  const gridW = HALF_W - margin * 2;
  const gridH = H - top - margin;
  const cell = 36; // 12 mm square cells

  // Red outer box & header line
  ctx.strokeStyle = "rgba(195, 65, 65, 0.65)";
  ctx.lineWidth = 2;
  ctx.strokeRect(left, margin, gridW, H - margin * 2);
  ctx.beginPath();
  ctx.moveTo(left, top);
  ctx.lineTo(left + gridW, top);
  ctx.stroke();

  ctx.fillStyle = "rgba(195, 65, 65, 0.72)";
  ctx.font = "13px serif";
  ctx.fillText("日期：", left + 10, margin + 30);
  ctx.fillText("成績：", left + gridW - 115, margin + 30);
  ctx.fillText("P." + pageLabel, left + gridW / 2 - 14, margin + 30);

  // Green square grid (方格)
  ctx.strokeStyle = "rgba(56, 142, 92, 0.36)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = left + cell; x < left + gridW; x += cell) {
    ctx.moveTo(x, top);
    ctx.lineTo(x, top + gridH);
  }
  for (let y = top + cell; y < top + gridH; y += cell) {
    ctx.moveTo(left, y);
    ctx.lineTo(left + gridW, y);
  }
  ctx.stroke();
}

function drawRoomEntities(room, offsetX) {
  ctx.save();
  ctx.translate(offsetX, 0);

  // Pickups
  for (const p of room.pickups) {
    if (p.collected) continue;
    const bob = Math.sin(performance.now() * 0.006) * 3;
    if (p.type === "chicken") {
      if (ASSETS.chicken.loaded) {
        ctx.drawImage(ASSETS.chicken, p.x, p.y + bob, p.w, p.h);
      } else {
        ctx.fillStyle = "#d97706";
        ctx.beginPath();
        ctx.ellipse(p.x + 13, p.y + 13 + bob, 11, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fef3c7";
        ctx.fillRect(p.x + 21, p.y + 10 + bob, 7, 5);
      }
    } else if (p.type === "hat") {
      if (ASSETS.hat.loaded) {
        ctx.drawImage(ASSETS.hat, p.x, p.y + bob, p.w, p.h);
      } else {
        ctx.fillStyle = "#eab308";
        ctx.fillRect(p.x + 4, p.y + 4 + bob, 22, 12);
        ctx.fillRect(p.x, p.y + 15 + bob, 30, 5);
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(p.x + 12, p.y + bob, 6, 6);
      }
    } else if (p.type === "gem") {
      ctx.fillStyle = "#0284c7";
      ctx.beginPath();
      ctx.moveTo(p.x + 11, p.y + bob);
      ctx.lineTo(p.x + 22, p.y + 11 + bob);
      ctx.lineTo(p.x + 11, p.y + 22 + bob);
      ctx.lineTo(p.x, p.y + 11 + bob);
      ctx.closePath();
      ctx.fill();
    } else if (p.type === "treasure") {
      if (ASSETS.treasure.loaded) {
        ctx.drawImage(ASSETS.treasure, p.x, p.y, p.w, p.h);
      } else {
        ctx.fillStyle = "#b45309";
        ctx.fillRect(p.x, p.y + 8, p.w, p.h - 8);
        ctx.fillStyle = "#fbbf24";
        ctx.fillRect(p.x - 2, p.y + 2, p.w + 4, 9);
        ctx.strokeStyle = "#78350f";
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y + 2, p.w, p.h - 2);
      }
    }
  }

  // Enemies
  for (const e of room.enemies) {
    if (!e.alive) continue;
    if (e.kind === "crawler") {
      const step = Math.floor(e.animTimer * 10);
      const squidge = step % 2 === 0 ? 2 : -2;
      if (ASSETS.monster.loaded) {
        ctx.drawImage(ASSETS.monster, e.x, e.y - squidge, e.w, e.h + squidge);
      } else {
        ctx.fillStyle = e.hurtTimer > 0 ? "#ef4444" : "#15803d";
        ctx.fillRect(e.x, e.y + 8 - squidge, e.w, e.h - 8 + squidge);
        ctx.fillStyle = "#fff";
        ctx.fillRect(e.facing === 1 ? e.x + 18 : e.x + 6, e.y + 14, 7, 7);
      }
    } else if (e.kind === "giant") {
      drawGiant(e);
    }
  }

  ctx.restore();
}

function drawGiant(g) {
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  const step = Math.floor(g.animTimer * 9);
  const bobY = g.aiState === "WALK" ? (step % 2 === 0 ? -4 : 0) : 0;
  const tilt = g.aiState === "WALK" ? (step % 2 === 0 ? -0.05 : 0.05) : (g.aiState === "WINDUP" ? -0.14 : 0.08);

  ctx.translate(g.x + g.w / 2, g.y + g.h + bobY);
  ctx.scale(g.facing, 1);
  ctx.rotate(tilt);

  if (ASSETS.giant.loaded) {
    ctx.drawImage(ASSETS.giant, -g.w / 2, -g.h, g.w, g.h);
  } else {
    // Sketch-ink Giant body
    ctx.fillStyle = g.hurtTimer > 0 ? "#ef4444" : "#475569";
    ctx.fillRect(-g.w / 2, -g.h + 22, g.w, g.h - 22);
    ctx.fillStyle = "#cbd5e1";
    ctx.fillRect(-16, -g.h, 32, 24);
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(4, -g.h + 7, 8, 5); // Glowing eye
  }

  // Giant's Swinging Ruler / Rod
  ctx.save();
  ctx.translate(8, -g.h * 0.56);
  ctx.rotate(g.rodAngle);
  if (ASSETS.giantRod.loaded) {
    ctx.drawImage(ASSETS.giantRod, -6, -g.rodLength, 14, g.rodLength);
  } else {
    // Yellow wooden school ruler (間尺)
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(-5, -g.rodLength, 12, g.rodLength);
    ctx.strokeStyle = "#78350f";
    ctx.lineWidth = 2;
    ctx.strokeRect(-5, -g.rodLength, 12, g.rodLength);
  }
  if (g.aiState === "STRIKE") {
    ctx.strokeStyle = "rgba(239, 68, 68, 0.75)";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(0, 0, g.rodLength, -1.7, 0.3);
    ctx.stroke();
  }
  ctx.restore();

  ctx.restore();

  // Giant HP bar
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(g.x, g.y - 12, g.w, 6);
  ctx.fillStyle = "#dc2626";
  ctx.fillRect(g.x + 1, g.y - 11, (g.w - 2) * Math.max(0, g.hp / g.maxHp), 4);
}

function drawHero() {
  if (hero.invulnTimer > 0 && Math.floor(hero.invulnTimer * 20) % 2 === 0) return;

  ctx.save();
  const cx = hero.x + hero.w / 2;
  const swing = hero.animState === "RUN" ? Math.sin(hero.animTimer) * 5 : 0;

  if (ASSETS.hero.loaded) {
    ctx.translate(cx, hero.y + hero.h);
    ctx.scale(hero.facing, 1);
    ctx.drawImage(ASSETS.hero, -hero.w / 2, -hero.h, hero.w, hero.h);
  } else {
    // Legs
    ctx.fillStyle = "#1e3a8a";
    ctx.fillRect(cx - 7 + swing, hero.y + 30, 5, 14);
    ctx.fillRect(cx + 2 - swing, hero.y + 30, 5, 14);

    // Coat / Torso
    ctx.fillStyle = "#b45309";
    ctx.fillRect(cx - 9, hero.y + 15, 18, 16);

    // Head + Dark Sunglasses (The Blind Treasure Hunter)
    ctx.fillStyle = "#f3c69f";
    ctx.fillRect(cx - 7, hero.y + 3, 14, 12);
    ctx.fillStyle = "#0f172a"; // Dark blind glasses
    ctx.fillRect(hero.facing === 1 ? cx - 2 : cx - 7, hero.y + 6, 9, 4);
  }

  // Mini-Missile Hat (if obtained)
  if (hero.hasMissileHat) {
    const ready = hero.hatCooldown <= 0;
    ctx.fillStyle = ready ? "#facc15" : "#854d0e";
    ctx.fillRect(cx - 10, hero.y - 1, 20, 4);
    ctx.fillRect(cx - 6, hero.y - 7, 12, 6);
    if (ready) {
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(cx - 2, hero.y - 10, 4, 4);
    }
  }

  // Machine Gun pivoted along the 5-direction aimAngle
  ctx.save();
  ctx.translate(cx, hero.y + hero.h * 0.45);
  ctx.rotate(hero.aimAngle);
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(2, -3, 18, 5);
  ctx.fillRect(6, 2, 4, 5);
  ctx.restore();

  ctx.restore();
}

function drawProjectilesAndParticles() {
  // Machine gun bullets
  ctx.fillStyle = "#1d4ed8";
  for (const b of game.bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Spinning chicken bones
  for (const bone of game.bones) {
    ctx.save();
    ctx.translate(bone.x, bone.y);
    ctx.rotate(bone.rot);
    if (ASSETS.bone.loaded) {
      ctx.drawImage(ASSETS.bone, -10, -5, 20, 10);
    } else {
      ctx.fillStyle = "#fffbeb";
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 1.5;
      ctx.fillRect(-9, -2.5, 18, 5);
      ctx.strokeRect(-9, -2.5, 18, 5);
      ctx.beginPath();
      ctx.arc(-9, -3, 3, 0, Math.PI * 2);
      ctx.arc(-9, 3, 3, 0, Math.PI * 2);
      ctx.arc(9, -3, 3, 0, Math.PI * 2);
      ctx.arc(9, 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Hat mini-missiles
  for (const m of game.missiles) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.atan2(m.vy, m.vx));
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(-10, -4, 20, 8);
    ctx.fillStyle = "#facc15";
    ctx.fillRect(6, -3, 6, 6);
    ctx.restore();
  }

  // Particles
  for (const p of game.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // Top arcade status bar above grid header
  ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
  ctx.fillRect(0, 0, W, 24);

  ctx.fillStyle = "#f8fafc";
  ctx.font = "bold 13px monospace";
  ctx.fillText(`THE BLIND TREASURE`, 14, 16);

  // HP Bar
  ctx.fillStyle = "#ef4444";
  ctx.fillText(`HP:`, 200, 16);
  ctx.fillStyle = "#334155";
  ctx.fillRect(228, 6, 100, 12);
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(228, 6, Math.max(0, hero.hp), 12);

  // Chicken Bones Count (max 4)
  ctx.fillStyle = "#fef08a";
  ctx.fillText(`BONES: ${hero.bones}/4`, 348, 16);

  // Special Hat Status
  if (!hero.hasMissileHat) {
    ctx.fillStyle = "#94a3b8";
    ctx.fillText(`HAT: NONE`, 460, 16);
  } else if (hero.hatCooldown <= 0) {
    ctx.fillStyle = "#facc15";
    ctx.fillText(`HAT: READY!`, 460, 16);
  } else {
    ctx.fillStyle = "#fb923c";
    ctx.fillText(`HAT: ${hero.hatCooldown.toFixed(1)}s`, 460, 16);
  }

  // Episode Timer & Score
  const mins = Math.floor(game.stageTimer / 60);
  const secs = Math.floor(game.stageTimer % 60).toString().padStart(2, "0");
  ctx.fillStyle = game.stageTimer < 60 ? "#f87171" : "#38bdf8";
  ctx.fillText(`TIME ${mins}:${secs}`, 610, 16);

  ctx.fillStyle = "#f8fafc";
  ctx.fillText(`SCORE ${game.score.toString().padStart(6, "0")}`, 740, 16);
  ctx.fillText(`[F2] DEBUG`, 895, 16);

  // F2 Debug Overlay (Hitboxes + Half-Screen Machine Gun Range Circle)
  if (game.debug) {
    const room = game.rooms[game.roomIdx];
    ctx.save();
    ctx.strokeStyle = "rgba(37, 99, 235, 0.45)";
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(hero.x + hero.w / 2, hero.y + hero.h * 0.45, HALF_W, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = "#22c55e";
    for (const s of room.solids) ctx.strokeRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = "#eab308";
    for (const l of room.ladders) ctx.strokeRect(l.x, l.y, l.w, l.h);
    ctx.strokeStyle = "#ef4444";
    ctx.strokeRect(hero.x, hero.y, hero.w, hero.h);
    ctx.restore();
  }

  // End-of-Run Banners
  if (game.state === "GAMEOVER" || game.state === "VICTORY") {
    ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = game.state === "VICTORY" ? "#facc15" : "#f87171";
    ctx.font = "bold 40px monospace";
    ctx.textAlign = "center";
    ctx.fillText(game.state === "VICTORY" ? "EPISODE TREASURE FOUND!" : "TIME / HP EXHAUSTED", W / 2, H / 2 - 20);
    ctx.fillStyle = "#f8fafc";
    ctx.font = "18px monospace";
    ctx.fillText(`FINAL SCORE: ${game.score}  —  PRESS [R] TO PLAY AGAIN`, W / 2, H / 2 + 28);
    ctx.textAlign = "left";
  }
}

/* ============================================================================
 * 9. FIXED 60 FPS MAIN LOOP
 * ========================================================================== */
let lastTime = performance.now();
let accumulator = 0;

function updateTick() {
  if (game.shakeTimer > 0) game.shakeTimer = Math.max(0, game.shakeTimer - DT);

  if (game.state === "TRANSITION") {
    const tr = game.transition;
    tr.t += DT;
    if (tr.t >= tr.duration) {
      tr.active = false;
      game.roomIdx = tr.toIdx;
      hero.x = tr.nextHeroX;
      hero.y = tr.nextHeroY;
      game.state = "PLAY";
    }
    return;
  }

  if (game.state !== "PLAY") return;

  game.stageTimer = Math.max(0, game.stageTimer - DT);
  if (game.stageTimer <= 0) {
    game.state = "GAMEOVER";
    return;
  }

  const room = game.rooms[game.roomIdx];
  const input = readInput();

  stepHero(input, room);
  stepProjectilesAndPickups(room);
  stepEnemies(room);
  stepParticles();

  for (const k in justPressed) delete justPressed[k];
}

function renderFrame() {
  ctx.save();
  if (game.shakeTimer > 0) {
    ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  }

  if (game.state === "TRANSITION") {
    const tr = game.transition;
    const p = Math.min(1, tr.t / tr.duration);
    const ease = 1 - Math.pow(1 - p, 3);
    const slideX = ease * W * tr.dirX;

    const fromRoom = game.rooms[tr.fromIdx];
    const toRoom = game.rooms[tr.toIdx];

    drawKaaiBouSpread(fromRoom, -slideX);
    drawRoomEntities(fromRoom, -slideX);

    drawKaaiBouSpread(toRoom, W * tr.dirX - slideX);
    drawRoomEntities(toRoom, W * tr.dirX - slideX);
  } else {
    const room = game.rooms[game.roomIdx];
    drawKaaiBouSpread(room, 0);
    drawRoomEntities(room, 0);
    drawHero();
    drawProjectilesAndParticles();
  }

  ctx.restore();
  drawHUD();
}

function loop(now) {
  const elapsed = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  accumulator += elapsed;

  while (accumulator >= DT) {
    updateTick();
    accumulator -= DT;
  }

  renderFrame();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
